4e49f2d0f610822ba5051b0f","lang":"en"},{"file":"2014-12-20-screen-gods-quiz-4","type":"snippets","title":"God's Quiz Season 4 (2014)","date":"2014-12-20","series":"screen","tags":["tv"],"description":"","cover":"/assets/snippets/screen/gods-quiz-4.png","review":"With the return of Han Jin-woo from a coma, God's Quiz 4 strengthens the emotional and romantic elements while maintaining a balance between a message about the socially underprivileged and dramatic entertainment, leaving a lingering impression with a clean conclusion.","key":"dac2bc0dc74a9cd1b71a339d15431eee","lang":"en"},{"file":"2015-11-07-screen-movie-ThePriests2015","type":"snippets","title":"The Priests (2015)","date":"2015-11-07","series":"screen","tags":["movie"],"description":"","cover":"/assets/snippets/screen/ThePriests2015.jpg","review":"We introduce a review and hidden details of the movie The Priests, which unfolds the unfamiliar subject of exorcism in Korea through Kang Dong-won's overwhelming visuals and performance.","key":"aa721f7e19941e15b0396fa81cc73392","lang":"en"},{"file":"2017-01-22-screen-tv-Goblin2016","type":"snippets","title":"Guardian: The Lonely and Great God (2016)","date":"2017-01-22","series":"screen","tags":["tv"],"description":"","cover":"/assets/snippets/screen/Goblin2016.jpg","review":"An honest review of the fantasy drama Guardian: The Lonely and Great God, featuring the exquisite casting of Gong Yoo and Lee Dong-wook, outstanding visual beauty, great acting, and warm direction.","key":"e321299ad9384743060c4f045d60d144","lang":"en"},{"file":"2017-12-10-screen-tv-Black(2017)","type":"snippets","title":"Black (2017)","date":"2017-12-10","series":"screen","tags":["tv"],"description":"","cover":"/assets/snippets/screen/Black(2017).jpg","review":"We present an honest review of the fantasy crime drama Black (2017), covering the entire work including its weak composition and forced settings despite the novel subject matter, frustrating characters, and disappointing ending.","key":"de964968d608a7bb8f643d8024e478d6","lang":"en"},{"file":"2019-02-13-screen-gods-quiz-5","type":"snippets","title":"God's Quiz: Reboot (2018)","date":"2019-02-13","series":"screen","tags":["tv"],"description":"","cover":"/assets/snippets/screen/gods-quiz-5.png","review":"God's Quiz: Reboot is a mystery crime drama review that sophisticatedly revived the series' identity with the new concept of AI autopsy, depicting a confrontation and revenge plot between attractive villains.","key":"8096a65cd8edcba357380c48a9626aac","lang":"en"},{"file":"2020-06-18-books-masquerade-hotel","type":"snippets","title":"Masquerade Hotel","date":"2020-06-18","series":"books","tags":["mystery"],"description":"Masquerade","cover":"/assets/snippets/books/masquerade-hotel.png","review":"Keigo Higashino's novel Masquerade Hotel deals with masquerade-like mystery episodes in a hotel setting, where guests hiding their purposes and investigators chasing a serial killer while undercover interact.","key":"8edb454112aa536fe5b794cb8d0e99bb","lang":"en"},{"file":"2020-07-02-books-the-famous-detectives-rules","type":"snippets","title":"The Rules of a Great Detective","date":"2020-07-02","series":"books","tags":["mystery"],"description":"A blade of criticism wrapped in a bundle of laughter","cover":"/assets/snippets/books/the-famous-detectives-rules.png","review":"A self-confessing novel by Keigo Higashino that satirizes the trite clichés of existing mystery novels and newly declares his literary orientation through a unique meta-fiction technique that breaks the fourth wall.","key":"9f60c1adfac782f6cfa0f5e8ea2424ee","lang":"en"},{"file":"2020-08-11-books-a-beautiful-weapon","type":"snippets","title":"A Beautiful Weapon","date":"2020-08-11","series":"books","tags":["thriller"],"description":"The corruption of sportsmanship and the loss of humanity","cover":"/assets/snippets/books/a-beautiful-weapon.png","review":"A review of Keigo Higashino's novel that sharply criticizes the dark side of doping, bioethics, and a success-oriented society through the downfall of characters who discarded human dignity for the success of a gold medal.","key":"b4e29d055c9c56edd0703557c7e2c325","lang":"en"},{"file":"2020-09-10-books-about-death","type":"snippets","title":"About Death","date":"2020-09-10","series":"books","tags":["story"],"description":"The boundary between life and death, and what story can you tell now?","cover":"/assets/snippets/books/about-death.png","review":"A review of the webtoon About Death, where God, as an observer rather than a judge, listens to the stories of the deceased and makes them realize the truth, regrets, and precious values of life on their own.","key":"2de94c794eb9336f66c6ef49c2a16524","lang":"en"},{"file":"2020-10-02-books-murder-by-the-lake","type":"snippets","title":"The Lakeside Murder Case","date":"2020-10-02","series":"books","tags":["mystery"],"description":"You're the one who said I'd only lose out if I didn't go to a good school, Mom","cover":"/assets/snippets/books/murder-by-the-lake.png","review":"A review of Keigo Higashino's novel The Lakeside Murder Case, which sharply explores the collective madness and twisted education fever of parents who engage in an irrational conspiracy to cover up a murder for their children's entrance exam success.","key":"2481f6cf55a04d01f60476ce8f0d81ab","lang":"en"},{"file":"2020-10-17-books-jack-of-white-silver","type":"snippets","title":"Snowboard Jack","date":"2020-10-17","series":"books","tags":["thriller"],"description":"The prelude to the Snow Mountain series","cover":"/assets/snippets/books/jack-of-white-silver.png","review":"A review of the first work in Keigo Higashino's Snow Mountain series, highlighting the realistic themes of corporate greed, absurdity, and evasion of responsibility in an isolated snowy field.","key":"73c9bdd464fa5186b9bf825a8183f1e2","lang":"en"},{"file":"2020-11-06-books-fellow-student","type":"snippets","title":"Fellow Student","date":"2020-11-06","series":"books","tags":["mystery"],"description":"Human psychology seen through the prism of youth","cover":"/assets/snippets/books/fellow-student.png","review":"A book review of Keigo Higashino's work that sharply highlights the deep distrust between teachers and students and the hypocrisy of the education sector, critically dealing with the structural contradictions of school and society.","key":"aef39be85ecd2dc1e328e2eadba8d232","lang":"en"},{"file":"2020-11-23-books-the-red-finger","type":"snippets","title":"The Red Finger","date":"2020-11-23","series":"books","tags":["mystery"],"description":"A mirror reflecting the modern family","cover":"/assets/snippets/books/the-red-finger.png","review":"Keigo Higashino's novel The Red Finger is a mystery work that sharply criticizes the issues of elderly alienation and parental responsibility through the moral collapse and tragedy of a family, exploring the human nature hidden behind the case.","key":"4b34e9bf357a83632b486ea8d5d1b9ef","lang":"en"},{"file":"2020-12-14-books-one-of-them-killed-her","type":"snippets","title":"Who Killed Her","date":"2020-12-14","series":"books","tags":["mystery"],"description":"The weight of truth delegated to the reader","cover":"/assets/snippets/books/one-of-them-killed-her.png","review":"A review of Keigo Higashino's novel Who Killed Her, which makes the reader find the culprit by combining clues themselves without revealing the culprit's name, introducing the charm of a work that established a new relationship with readers through elaborate tricks.","key":"f2dc5d3ead6d7cb5acd286bf2b913d11","lang":"en"},{"file":"2021-01-02-books-premonitory-dream","type":"snippets","title":"Premonitory Dream","date":"2021-01-02","series":"books","tags":["mystery"],"description":"Dissecting the occult with the eyes of science","cover":"/assets/snippets/books/premonitory-dream.png","review":"Keigo Higashino's novel Premonitory Dream explains supernatural mystery cases through the scientific principles of Galileo, posing questions about the coexistence of superstition and science while reminding us of the importance of logical thinking habits.","key":"a0490fd8ec549842f5df5dec671ff649","lang":"en"},{"file":"2021-01-23-books-the-salvation-of-the-saint","type":"snippets","title":"Salvation of a Saint","date":"2021-01-23","series":"books","tags":["mystery"],"description":"Salvation and a single day of judgment - Imaginary Solution","cover":"/assets/snippets/books/the-salvation-of-the-saint.png","review":"The second full-length novel in Keigo Higashino's Detective Galileo series, this review of a mystery masterpiece deals with the ingenious tricks and the truth of a perfect crime created by the effort not to kill through the concepts of imaginary solutions and salvation.","key":"5fdd523cce8beae2c3e15c9db38cd79f","lang":"en"},{"file":"2021-02-12-books-storm-wind-and-blade","type":"snippets","title":"Shipu Rondo","date":"2021-02-12","series":"books","tags":["thriller"],"description":"Desperate pursuit and comic irony","cover":"/assets/snippets/books/storm-wind-and-blade.png","review":"This work by Keigo Higashino begins as a thriller with an intelligent criminal, but turns into a comedy through the mistakes of a clumsy middle-aged researcher, offering a unique comic irony through the resolution of the case with helpers and a hollow ending.","key":"7c14cdffc9aa101c45ce64cc3aabd65d","lang":"en"},{"file":"2021-02-23-books-the-dangerous-venus","type":"snippets","title":"The Dangerous Venus","date":"2021-02-23","series":"books","tags":["mystery"],"description":"Was that a fractal too?","cover":"/assets/snippets/books/the-dangerous-venus.png","review":"A review of Keigo Higashino's mystery novel, which uses mathematics and neuroscience to contain the author's deep reflection on fanatical intellectual greed and bioethics hidden behind the inheritance cliché.","key":"db3901be18a2035a4466916b0231b123","lang":"en"},{"file":"2021-03-02-books-fate","type":"snippets","title":"Fate","date":"2021-03-02","series":"books","tags":["mystery"],"description":"It doesn't matter what blood flows in me. What matters is what fate was given to me.","cover":"/assets/snippets/books/fate.png","review":"Keigo Higashino's novel Fate is a mystery work that poses philosophical questions about scientific ethics issues hidden behind a murder case and the free will of humans in front of a giant destiny.","key":"1afee2e029b49b7e9a9d4efdbed8063d","lang":"en"},{"file":"2021-03-11-books-the-curse-of-the-great-detective","type":"snippets","title":"The Curse of the Great Detective","date":"2021-03-11","series":"books","tags":["mystery"],"description":"The collapse of the boundary between reality and fiction","cover":"/assets/snippets/books/the-curse-of-the-great-detective.png","review":"A self-reflective work by Keigo Higashino that criticizes the limitations of the 'shin-honkaku' mystery genre, depicting the inner world of an author in a creative slump and the importance of reality through the mysterious space called the cemetery of books.","key":"c93f7384702bc15827818aa43a62dc26","lang":"en"},{"file":"2021-03-20-books-malice","type":"snippets","title":"Malice","date":"2021-03-20","series":"books","tags":["mystery"],"description":"From manipulated motives to pure malice","cover":"/assets/snippets/books/malice.png","review":"Keigo Higashino's novel Malice is a mystery masterpiece that doggedly tracks the motive rather than the culprit, exploring the pure hatred of humans and the fiction behind the truth through the perpetrator's hand-written account and Detective Kaga's investigation record.","key":"45d5ee01d71dab392edc8b372e6ea03b","lang":"en"},{"file":"2021-03-26-books-the-games-name-is-kidnapping","type":"snippets","title":"The Game's Name is Kidnapping","date":"2021-03-26","series":"books","tags":["mystery"],"description":"A game with no winners","cover":"/assets/snippets/books/the-games-name-is-kidnapping.png","review":"A mystery novel by Keigo Higashino that reconstructs an unconventional kidnapping plot conspired by the hostage and the culprit into the frame of a 'game', in-depthly depicting the win-loss oriented values of modern society, sophisticated narrative tricks, and unpredictable twists.","key":"695c56209f354da2e85ad98ca82df740","lang":"en"},{"file":"2021-04-08-books-suspicious-people","type":"snippets","title":"Suspicious People","date":"2021-04-08","series":"books","tags":["mystery"],"description":"How weak and dangerous can the human heart be?","cover":"/assets/snippets/books/suspicious-people.png","review":"Keigo Higashino's novel Suspicious People delves sharply into the dark desires and prejudices of humans hidden in ordinary daily life through seven short stories, posing heavy questions about truth and trust.","key":"bc3682172f608b1b39e8b9d5ec3aac03","lang":"en"},{"file":"2021-04-17-books-a-night-of-murder-without-a-perpetrator","type":"snippets","title":"A Night of Murder Without a Perpetrator","date":"2021-04-17","series":"books","tags":["mystery"],"description":"Why did they reach death?","cover":"/assets/snippets/books/a-night-of-murder-without-a-perpetrator.png","review":"Keigo Higashino's early short story collection A Night of Murder Without a Perpetrator sharply explores the nature hidden within us and the banality of evil through the tragic butterfly effect brought about by the minor malice and intent of ordinary people.","key":"223d52912c576152418ba881bb5cd652","lang":"en"},{"file":"2021-04-22-books-i-killed-him","type":"snippets","title":"I Killed Him","date":"2021-04-22","series":"books","tags":["mystery"],"description":"From misconception to truth","cover":"/assets/snippets/books/i-killed-him.png","review":"In the confusion where three suspects all claim they are the culprit, Keigo Higashino's novel I Killed Him, which makes the reader directly infer the true culprit, provides the fun of active participation and judgment through the separation of causality and accountability.","key":"e2348ae6e247f5eda72c9439bf9d5801","lang":"en"},{"file":"2021-05-02-books-the-11-character-killing","type":"snippets","title":"The 11-Character Murder","date":"2021-05-02","series":"books","tags":["mystery"],"description":"The echo of resentment that rang from a deserted island","cover":"/assets/snippets/books/the-11-character-killing.png","review":"A book review of Keigo Higashino's novel that densely deals with realistic groups of people where there is no absolute good or evil and the moral dilemma of true justice through the alternating perspectives of the protagonist and the culprit.","key":"e844dea07f3cfc859b8193462921c74d","lang":"en"},{"file":"2021-05-11-books-after-school","type":"snippets","title":"After School","date":"2021-05-11","series":"books","tags":["mystery"],"description":"It seems it's going to be a long after-school","cover":"/assets/snippets/books/after-school.png","review":"Keigo Higashino's debut work, a mystery novel that deals with incomprehensible motives and psychological gaps in the closed society of high school girls, along with engineering-based locked-room murder tricks.","key":"be5ab6a0cc00bc3520ba010960985b5c","lang":"en"},{"file":"2021-05-18-books-just-one-more-lie","type":"snippets","title":"Just One More Lie","date":"2021-05-18","series":"books","tags":["mystery"],"description":"The weight of lies and human nature","cover":"/assets/snippets/books/just-one-more-lie.png","review":"The only short story collection in Keigo Higashino's Detective Kaga series, it contains the process of uncovering the truth through various aspects of human nature revealed through lies and the dense psychological warfare of Detective Kaga.","key":"acc9179d110e06818565b597ea2a9417","lang":"en"},{"file":"2021-05-27-books-the-sleeping-forest","type":"snippets","title":"The Sleeping Forest","date":"2021-05-27","series":"books","tags":["mystery"],"description":"A brilliant tragedy created by devoted love","cover":"/assets/snippets/books/the-sleeping-forest.png","review":"An early work in Keigo Higashino's Detective Kyoichiro Kaga series, this review introduces the charm of a romantic mystery novel that uncovers the truth while deeply insighting the motives for crime and human desires set in a closed ballet society.","key":"e94e402d1fb3efa42056d572657c4ad5","lang":"en"},{"file":"2021-06-09-books-the-devotion-of-suspect-x","type":"snippets","title":"The Devotion of Suspect X","date":"2021-06-09","series":"books","tags":["mystery"],"description":"Looks like a geometry problem, but is actually a function problem","cover":"/assets/snippets/books/the-devotion-of-suspect-x.png","review":"Keigo Higashino's The Devotion of Suspect X is a masterpiece of mystery that goes beyond finding the culprit to ask 'why' and 'how', melting the P=NP problem into criminal philosophy, allowing readers to experience the truth hidden behind a perfect alibi and the unique psychology of becoming an accomplice.","key":"00a560f06c44f3d3f632cb9b63715a2b","lang":"en"},{"file":"2021-06-20-books-the-heart-of-brutus","type":"snippets","title":"The Heart of Brutus","date":"2021-06-20","series":"books","tags":["mystery"],"description":"Et tu, Brute?","cover":"/assets/snippets/books/the-heart-of-brutus.png","review":"Keigo Higashino's The Heart of Brutus is a mystery novel that sharply warns of the tragic relationship between technological development and human ethics ahead of its time through the novel setup of a murder relay and the theme of betrayal.","key":"fd5da2c09e78d5f1ec981d81f6b477d8","lang":"en"},{"file":"2021-07-03-books-the-traffic-officers-night","type":"snippets","title":"The Traffic Officer's Night","date":"2021-07-03","series":"books","tags":["thriller"],"description":"Are you the perpetrator or the victim behind the wheel?","cover":"/assets/snippets/books/the-traffic-officers-night.png","review":"Keigo Higashino's novel The Traffic Officer's Night sharply explores human selfishness and moral responsibility through the tragedies caused by everyday traffic violations, throwing a heavy warning to our society.","key":"6cf5e1cbf65214d4b8e7f17cf30efdd5","lang":"en"},{"file":"2021-07-14-books-lemon","type":"snippets","title":"Lemon","date":"2021-07-14","series":"books","tags":["mystery"],"description":"I am not the only human in this world. Then what value does my existence have?","cover":"/assets/snippets/books/lemon.png","review":"Keigo Higashino's novel Lemon explores the origins of human existence and social perception through the subject of clones, in-depthly dealing with the decisive influence of the environment and upbringing on personal identity formation over genetic factors.","key":"09fe7a456a21519ee4087b30ed579d7b","lang":"en"},{"file":"2021-07-22-books-the-hollow-cross","type":"snippets","title":"The Hollow Cross","date":"2021-07-22","series":"books","tags":["mystery"],"description":"Asking the weight of the cross","cover":"/assets/snippets/books/the-hollow-cross.png","review":"Through three murder cases in Keigo Higashino's novel The Hollow Cross, we deeply contemplate human conscience, the meaning of true atonement, and the hollow cross placed under the judicial system.","key":"2dde601355f5a61fa681ac6f1bcee01a","lang":"en"},{"file":"2021-08-01-books-dream-painting","type":"snippets","title":"Dream Flower","date":"2021-08-01","series":"books","tags":["mystery"],"description":"There is no yellow in morning glories, right?","cover":"/assets/snippets/books/dream-painting.png","review":"A novel that well demonstrates Keigo Higashino's unique style and heavy thematic consciousness through the process where disparate narratives of random murders and nuclear research are intricately intertwined and completed as a single puzzle.","key":"22c7e7eb1c173d9bc0b31cb397e4a9cc","lang":"en"},{"file":"2021-08-12-books-white-night-journey","type":"snippets","title":"Journey Under the Midnight Sun","date":"2021-08-12","series":"books","tags":["thriller"],"description":"The story of a man and a woman who had to walk through the day without the sun","cover":"/assets/snippets/books/white-night-journey.png","review":"A review of Keigo Higashino's novel Journey Under the Midnight Sun, containing insights into complex human existence and the deep lingering impression left by the terribly beautiful final scene, while exploring Yukiho's desperate sadness and the dark abyss of humans.","key":"cb854cc3d1e386795fc22a80ff5d672a","lang":"en"},{"file":"2021-09-10-books-the-house-i-died-years-ago","type":"snippets","title":"The House Where I Died","date":"2021-09-10","series":"books","tags":["mystery"],"description":"I must go to that house","cover":"/assets/snippets/books/the-house-i-died-years-ago.png","review":"This work, which Keigo Higashino mentioned as his ambitious project, contains the charm of high-density mystery that digs into the dark inner self and truth of humans through fragments of memory in a limited space with only two characters.","key":"bb68813521bd7b8c2dd94e781a3bfa7d","lang":"en"},{"file":"2021-09-18-books-mrs-claus","type":"snippets","title":"Santa Claus's Wife","date":"2021-09-18","series":"books","tags":["story"],"description":"Anyway, everyone agrees","cover":"/assets/snippets/books/mrs-claus.png","review":"A book review of Keigo Higashino's work that easily and interestingly explores the fixed ideas we take for granted in daily life through a manga format, starting with the question 'Does Santa always have to be a man?'","key":"8bf86092b0610ae2625ec8a27dab97ec","lang":"en"},{"file":"2021-09-20-books-there-are-happy-things-every-day","type":"snippets","title":"Winnie-the-Pooh: There are Happy Things Every Day","date":"2021-09-20","series":"books","tags":["story"],"description":"Don't worry even if you feel like you're going to be depressed. You might just be hungry.","cover":"/assets/snippets/books/there-are-happy-things-every-day.png","review":"A book review where you can find heart-warming comfort and simple messages from Winnie-the-Pooh to discover small hidden happinesses every day and gain peace of mind during difficult times.","key":"56cf68fa8e713711693c996c1d2908b8","lang":"en"},{"file":"2021-09-21-books-a-story-that-is-gone-now","type":"snippets","title":"A Story That Is Gone Now","date":"2021-09-21","series":"books","tags":["story"],"description":"A story we need right now, overturning all existing fables","cover":"/assets/snippets/books/a-story-that-is-gone-now.png","review":"Sharply insighting gaslighting in the name of social order and the cold reality through the 'Unhappy Boy' and 'Armor City' in Choi Kyu-sok's work, sharing the pleasure of deep thinking and discussion.","key":"06952d0e8dbac481eb9c4a6f2debcdda","lang":"en"},{"file":"2021-10-01-books-the-courage-to-be-hated","type":"snippets","title":"The Courage to Be Hated","date":"2021-10-01","series":"books","tags":["humanities"],"description":"All problems in life stem from interpersonal relationships","cover":"/assets/snippets/books/the-courage-to-be-hated.png","review":"A book review exploring the philosophical insights that current choices and resolutions determine life rather than past trauma, based on Adlerian psychology's teleology, and the essence of interpersonal relationships, the root of all problems.","key":"ff496c9a8dfa5c224347cb7c53b4c028","lang":"en"},{"file":"2021-10-12-books-demian","type":"snippets","title":"Demian","date":"2021-10-12","series":"books","tags":["novel"],"description":"The bird fights its way out of the egg. The egg is the world. Who would be born must first destroy a world.","cover":"/assets/snippets/books/demian.png","review":"Hermann Hesse's masterpiece Demian is the best coming-of-age novel of the 20th century, depicting Emil Sinclair's process of finding his true self by integrating the duality of good and evil through the symbol of Abraxas.","key":"688d95ed7ee873ac6bfc1a4d2ba450cd","lang":"en"},{"file":"2021-10-22-books-twelve-footsteps","type":"snippets","title":"Twelve Footsteps","date":"2021-10-22","series":"books","tags":["science"],"description":"Twelve lectures that lead you to an adventure of thought, a forest of intelligence, and a world off the map.","cover":"/assets/snippets/books/twelve-footsteps.png","review":"Brain scientist Jeong Jae-seung's Twelve Footsteps is an excellent popular science book that looks into the human heart through brain science, views society and the future through complex systems science, and poses new questions to the familiar world.","key":"6567fb78d506a87e70dcfb403cc13342","lang":"en"},{"file":"2021-11-02-books-lesixieme-sommeil-1","type":"snippets","title":"The Sixth Sleep 1","date":"2021-11-02","series":"books","tags":["sf"],"description":"What would happen if we could control our dreams or go to the past through them?","cover":"/assets/snippets/books/lesixieme-sommeil-1.png","review":"A book review exploring lucid dreaming and the stages of sleep through Bernard Werber's novel, interestingly explaining through brain science and imagination that sleep is not just rest but a mysterious journey to experience another life.","key":"bcfa44c0c329999a1591e7c1f5bd21f9","lang":"en"},{"file":"2021-11-20-books-lesixieme-sommeil-2","type":"snippets","title":"The Sixth Sleep 2","date":"2021-11-20","series":"books","tags":["sf"],"description":"The past, present, and future met in the final stage of sleep","cover":"/assets/snippets/books/lesixieme-sommeil-2.png","review":"Bernard Werber's novel The Sixth Sleep 2 stands out for its fresh subject matter and giant imagination, but it's a work that gives a feeling of a 'dragon's head and a snake's tail' due to its convenient setup and repeated narrative in the latter half.","key":"159bdada6029cfb76d92599821dc9a88","lang":"en"},{"file":"2021-12-01-books-the-selfish-gene","type":"snippets","title":"The Selfish Gene","date":"2021-12-01","series":"books","tags":["science"],"description":"Humans are merely survival machines programmed to carry out the genes' desire for replication.","cover":"/assets/snippets/books/the-selfish-gene.png","review":"Richard Dawkins's The Selfish Gene defines the subject of evolution as the gene and clearly explains the essence of altruistic behavior and the concept of memes, the cultural gene, along with an innovative perspective of viewing living things, including humans, as survival machines for genes.","key":"aaf55e19595026b1b4f8bfaa295d2b3d","lang":"en"},{"file":"2022-01-02-books-the-kind-worth-killing","type":"snippets","title":"The Kind Worth Killing","date":"2022-01-02","series":"books","tags":["thriller"],"description":"You're doing a good thing for the world.","cover":"/assets/snippets/books/the-kind-worth-killing.png","review":"Peter Swanson's novel The Kind Worth Killing in-depthly deals with human desire and the justification of murder amidst betrayal and twists, presenting a chilling tension and an open ending that leaves a lingering impression.","key":"c92a5a36438ec5a51ce60bad3c091c2e","lang":"en"},{"file":"2022-01-15-books-brave-new-world","type":"snippets","title":"Brave New World","date":"2022-01-15","series":"books","tags":["sf"],"description":"How much of a human is a human?","cover":"/assets/snippets/books/brave-new-world.png","review":"Through Aldous Huxley's novel Brave New World, we contemplate the value conflict between stable happiness and painful freedom, and look back on what we gain and lose through technological development in the age of artificial intelligence.","key":"1eda0f619f7587ebf9337a5fef521388","lang":"en"},{"file":"2022-01-25-books-almond","type":"snippets","title":"Almond","date":"2022-01-25","series":"books","tags":["novel"],"description":"A growth narrative written with a cold head and a warm heart","cover":"/assets/snippets/books/almond.png","review":"A review of the novel Almond, which asks the meaning of true empathy in an age of inability to empathize, looking critically at modern society that has become insensitive to the sadness of others, and interpreting the miracle-like ending as the protagonist's hope-filled fantasy.","key":"28af8adc1615df2e5de4140691696203","lang":"en"},{"file":"2022-02-01-books-gomtang-1","type":"snippets","title":"Gomtang 1: The Killer from the Future","date":"2022-02-01","series":"books","tags":["thriller"],"description":"I wanted to live here, in this present, somehow.","cover":"/assets/snippets/books/gomtang-1.png","review":"Set in Busan in 2063, Kim Young-tak's novel Gomtang depicts the bizarre murder cases and stories of people from the future encountered by the protagonist, who risks his life to travel back in time to learn a gomtang recipe, with overwhelming immersion.","key":"bdfed877ef95a0caf39b1fa5a83d16fc","lang":"en"},{"file":"2022-02-12-books-gomtang-2","type":"snippets","title":"Gomtang 2: The Night Twelve People Disappeared","date":"2022-02-12","series":"books","tags":["thriller"],"description":"A utopia built by stealing the future, cruel truth and belated regret blooming within it","cover":"/assets/snippets/books/gomtang-2.png","review":"A Korean-style time-leap novel by Kim Young-tak that stands out for its fast-paced development and meticulous retrieval of foreshadowing, highly recommended as a work that breaks prejudices against Korean novels along with deep questions about utopia.","key":"5cc0e5bc970e0f6fa42371e7d2836b28","lang":"en"},{"file":"2022-02-20-books-28","type":"snippets","title":"28","date":"2022-02-20","series":"books","tags":["thriller"],"description":"Everyone just wanted to survive","cover":"/assets/snippets/books/28.png","review":"A review of Jeong You-jeong's novel 28, which realistically depicts the human nature and selfishness that turn cruel for survival amidst a disaster caused by a fatal zoonotic disease, making us reflect on the true meaning of humanity and hope.","key":"0ecb8b6c36e7b2d1cb5f930218bf5c02","lang":"en"},{"file":"2022-03-02-books-the-origin-of-species","type":"snippets","title":"The Good Son","date":"2022-03-02","series":"books","tags":["thriller"],"description":"The birth of a predator, a record of those 3 days","cover":"/ llows Hercule Poirot as he tracks the true culprit while uncovering the elaborate traps and false clues of serial murders occurring in alphabetical order.","key":"615689798bb5079fa153081c54f59dc0","lang":"en"},{"file":"2022-04-02-books-murder-on-the-orient-express","type":"snippets","title":"Murder on the Orient Express","date":"2022-04-02","series":"books","tags":["mystery"],"description":"Facing a once-in-a-lifetime choice between legal justice and human justice","cover":"/assets/snippets/books/murder-on-the-orient-express.png","review":"A review of Agatha Christie's representative mystery novel where Hercule Poirot uncovers the truth among 12 suspects with perfect alibis in a closed train, posing a heavy question about the legitimacy of private justice and righteousness.","key":"cc4ae58f497715450f4a83dcf2356a76","lang":"en"},{"file":"2022-04-10-books-such-unexpected-neuroscience","type":"snippets","title":"Seven and a Half Lessons About the Brain","date":"2022-04-10","series":"books","tags":["science"],"description":"Knowing the brain means knowing me and humans","cover":"/assets/snippets/books/such-unexpected-neuroscience.png","review":"Through Lisa Feldman Barrett's work, we understand that the essence of the brain lies not in thought but in allostasis, the management of the body budget, and present new insights into the principles by which the brain predicts the world and constructs emotions.","key":"c1c33a278c3fc8abe7beb8410310accf","lang":"en"},{"file":"2022-04-20-books-endless-night","type":"snippets","title":"Endless Night","date":"2022-04-20","series":"books","tags":["mystery"],"description":"Some are Born to Endless Night","cover":"/assets/snippets/books/endless-night.png","review":"One of Agatha Christie's most cherished works, it's a twist novel that densely depicts the twisted inner self of a human, a perfect crime, and the process of self-destruction through the eyes of an unreliable narrator.","key":"4d087452dfa3b2f8ba7bb4bc01b7ee3e","lang":"en"},{" k Cat.","key":"2d13ab8a34132a4a3afecf223ad218dd","lang":"en"},{"file":"2022-06-15-books-the-boy-who-plays-the-rainbow","type":"snippets","title":"The Boy Who Plays the Rainbow","date":"2022-06-15","series":"books","tags":["thriller"],"description":"I wanted to open people's eyes. Every human holds the key to the next evolution","cover":"/assets/snippets/books/the-boy-who-plays-the-rainbow.png","review":"Keigo Higashino's novel The Boy Who Plays the Rainbow stands out for its fresh subject matter of 'Light Music' that conveys messages through light, but it's a disappointing work due to typical developments like conspiracies of the powerful and Japanese school-themed tropes.","key":"dba20e2e9b9e80cde715f341b58762c1","lang":"en"},{"file":"2022-06-25-books-science-concert","type":"snippets","title":"Jeong Jae-seung's Science Concert","date":"2022-06-25","series":"books","tags":["science"],"description":"Clear science in a complex world","cover":"/assets/snippets/books/science-concert.png","review":"Jeong Jae-seung's book, which interestingly explains science in daily life, provides joy in deeply understanding humans through brain science and offers insights to approach science in a friendly way rather than as something stiff.","key":"776d6ab08a3e829483616cfe7fc200c5","lang":"en"},{"file":"2022-07-02-books-crooked-house","type":"snippets","title":"Crooked House","date":"2022-07-02","series":"books","tags":["mystery"],"description":"The monster is not outside, but inside the house","cover":"/assets/snippets/books/crooked-house.png","review":"A review of Agatha Christie's novel dealing with the shocking identity of a psychopathic culprit who records the murder process, and the tragic and intense conclusion faced by characters who were ignoring the truth.","key":"41f3bb8844bcf530cb6844c3fef9da69","lang":"en"},{"file":"2022-07-10-books-false-accusation","type":"snippets","title":"Ordeal by Innocence","date":"2022-07-10","series":"books","tags":["mystery"],"description":"Truth was not the victory of justice, but the pain that destroyed everything","cover":"/assets/snippets/books/false-accusation.png","review":"A review of Agatha Christie's novel Ordeal by Innocence, which deals with the uncomfortable truth brought about by the acquittal of a family member and the narrative structure of the original work that is differentiated from the drama.","key":"a77695b51f438b9069e19a3f7fb600ae","lang":"en"},{"file":"2022-07-19-books-jini-genie","type":"snippets","title":"Jini, Genie","date":"2022-07-19","series":"books","tags":["novel"],"description":"Two souls thrown into a whirlpool of fate, warmly resonating across the boundary between life and death","cover":"/assets/snippets/books/jini-genie.png","review":"Jeong You-jeong's Jini, Genie looks into the contradictions of the human world through a bonobo and is a work that provides deep life lessons and emotion with a cheerful and warm perspective different from previous works.","key":"f8c0d09589cdb5d7e3efcf4960db41bc","lang":"en"},{"file":"2022-07-20-books-the-demand-for-depth","type":"snippets","title":"The Depth","date":"2022-07-20","series":"books","tags":["novel"],"description":"No depth","cover":"/assets/snippets/books/the-demand-for-depth.png","review":"Patrick Süskind's The Depth is a short story that provides a deep resonance to the reader by briefly and intensely insightfully examining the reality where 'depth', a social standard, encroaches on individual lives and the duality of standards one applies to oneself.","key":"dbd9ea16f1647a0b334e582283334fb4","lang":"en"},{"file":"2022-07-25-books-moving-finger","type":"snippets","title":"The Moving Finger","date":"2022-07-25","series":"books","tags":["mystery"],"description":"In a small country village, a single letter spreads distrust and murder. The finger has already moved","cover":"/assets/snippets/books/moving-finger.png","review":"A review of Agatha Christie's Miss Marple series novel, which keenly insightfully explores human malice th limited refill service for noodles and rice.","key":"b2ee870c0e2957d3c390f848c81efb56","lang":"en"},{"file":"2026-01-22-stash-uiautomator-dump-in-aosp","type":"snippets","title":"uiautomator dump","date":"2026-01-22","series":"stash","tags":["aosp"],"description":"Inspect UI hierarchy using uiautomator dump","cover":"","review":"Introduces how to use uiautomator, an Android UI testing framework, to automate interactions between apps at the system level and dump the UI hierarchy of the current screen into XML for analysis.","key":"6ee0ee119420939031fda9d7b806fbd2","lang":"en"},{"file":"2026-01-27-stash-change-CRLF-to-LF","type":"snippets","title":"Change CRLF to LF","date":"2026-01-27","series":"stash","tags":["git","shell"],"description":"","cover":"","review":"Explains specific methods for unifying the line ending format of a project to LF through .gitattributes settings and renormalization to solve Git collaboration issues caused by line ending differences between Windows and Unix-like operating systems.","key":"82710ec2cccb8d36aff26613727e723e","lang":"en"},{"file":"2026-01-27-stash-remote-adb-using-ssh-tunneling","type":"snippets","title":"Remote ADB using SSH Tunneling","date":"2026-01-27","series":"stash","tags":["aosp"],"description":"How to access Android devices connected to a remote server from a local machine using ADB and SSH Tunneling","cover":"/assets/snippets/stash/Remote_ADB_using_SSH_Tunneling.png","review":"Introduces how to debug and control an Android device connected to a remote server in a local environment using ADB as if it were directly connected to your PC, utilizing the local port forwarding feature of SSH tunneling.","key":"15e14a2f43c5c7dbcd3d24d979436fdb","lang":"en"},{"file":"2026-02-10-stash-efficient-node.js-management-using-NVM","type":"snippets","title":"Efficient Node.js Management using NVM (Node Version Manager)","date":"2026-02-10","series":"stash","tags":["linux"],"description":"","cover":"","review":"Learn how to install and configure NVM (Node Version Manager) and discover tips for easily installing and managing various versions of Node.js to build an optimized development environment for each project.","key":"0b123f2203b78e0f4c8e216478df3220","lang":"en"},{"file":"2026-02-10-stash-fixing-docker-daemon-socket-permission-denied-error","type":"snippets","title":"Fixing Docker Daemon Socket Permission Denied Error","date":"2026-02-10","series":"stash","tags":["docker","linux"],"description":"A quick guide to resolving the 'permission denied' issue when connecting to the Docker daemon socket by managing user groups","cover":"","review":"Learn about the specific causes and solutions for the \\\"permission denied\\\" error that occurs when running Docker, by adding your user account to the docker group to execute commands without sudo.","key":"64f8cde489d176180745697a1b6653c9","lang":"en"},{"file":"2026-02-10-stash-how-to-configure-ZRAM-on-linux","type":"snippets","title":"How to Configure ZRAM on Linux","date":"2026-02-10","series":"stash","tags":["linux"],"description":"","cover":"","review":"Introduces the concept and advantages of ZRAM, which increases available capacity in memory-constrained environments, and explains how to protect system performance and storage life through installation and optimization using zram-tools.","key":"0989bafa8f3b7bf94e6597a9da3074d9","lang":"en"},{"file":"2026-02-11-stash-setting-up-swap-file-on-linux","type":"snippets","title":"Setting up Swap File on Linux","date":"2026-02-11","series":"stash","tags":["linux"],"description":"How to create and configure a swap file to expand virtual memory on Linux systems","cover":"","review":"Provides step-by-step guidance on creating and activating a swap file to supplement insufficient memory on Linux systems, including setting security permissions, permanent application via fstab registration, and optimizing Swappiness for efficient memory management.","key":"0fcae47e194823f268a948f14b6093fe","lang":"en"},{"file":"2026-02-19-stash-Customizing-Bash-Prompt-with-PROMPT_COMMAND","type":"snippets","title":"Customizing Bash Prompt with PROMPT_COMMAND","date":"2026-02-19","series":"stash","tags":["bash"],"description":"How to customize your terminal prompt using the PROMPT_COMMAND environment variable in Bash","cover":"","review":"Learn how to efficiently customize and set terminal prompts in Bash using the PROMPT_COMMAND environment variable, including displaying real-time timestamps, applying colors, and dynamically updating information.","key":"39f533253c5e6d8d84bdc5ab5afb33dc","lang":"en"},{"file":"2026-02-25-books-the-redemption-of-time","type":"snippets","title":"Three-Body X: The Redemption of Time","date":"2026-02-25","series":"books","tags":["sf"],"description":"A fan fiction becomes an official sequel","cover":"/assets/snippets/books/the-redemption-of-time.png","review":"Check out this interesting review of Baoshu's novel, an official spin-off of the Three-Body series, which follows Yun Tianming's journey after his brain was captured and resolves hidden mysteries of the original work, completing the vast narrative of the Three-Body universe.","key":"cee1b961c2b80d89c39fbe9b9186703c","lang":"en"},{"file":"2026-02-27-stash-getting-started-with-ollama","type":"snippets","title":"Getting Started with Ollama","date":"2026-02-27","series":"stash","tags":["llm"],"description":"How to install and run local LLMs using Ollama and integration with OpenClaw","cover":"","review":"Learn how to install Ollama, an open-source tool for easily installing and running large language models (LLMs) like Llama 3 and Mistral locally in a Linux environment, along with key commands and OpenClaw integration.","key":"555ac87158047f112569d7fa479b56e9","lang":"en"},{"file":"2026-02-28-location-restaurant-chome","type":"snippets","title":"CHOME","date":"2026-02-28","series":"location","tags":["restaurant"],"description":"","cover":"/assets/snippets/location/77d302bdb169750f29576d01709bcffb.jpg","review":"A candid visit review of CHOME, a wine bar on Sinheung-ro, Yongsan-gu, Seoul, where I enjoyed unique dishes like corn pasta and pork ribs along with wine, experiencing fine dining-like service and atmosphere.","key":"de96831f87f6ff9eca57a718689503f9","lang":"en"},{"file":"2026-03-02-screen-movie-TheManWhoLiveswiththeKing2026","type":"snippets","title":"The Man Who Lives with the King (2026)","date":"2026-03-02","series":"screen","tags":["movie"],"description":"","cover":"/assets/snippets/screen/TheManWhoLiveswiththeKing2026.jpg","review":"The movie \\\"The Man Who Lives with the King\\\" re-examines King Danjong's exile and death from the perspective of the people. It is a historical drama that delivers heavy sadness and a deep resonance through the dense acting of actor Yoo Hae-jin.","key":"2c2f38319d540ac00e9062ccb860430f","lang":"en"},{"file":"2026-03-03-stash-check-trading-holidays-using-exchange_calendars","type":"snippets","title":"Check Trading Holidays using exchange_calendars in python","date":"2026-03-03","series":"stash","tags":["python"],"description":"How to check stock market trading holidays using the exchange_calendars library in Python.","cover":"","review":"Introduces how to use the exchange_calendars library in Python to check whether the Korea Exchange (KRX) is open and its holidays, thereby increasing the operational efficiency of automated stock trading systems.","key":"7735da9092413bff624721741e68bcd3","lang":"en"},{"file":"2026-03-20-location-cafe-Smithathome","type":"snippets","title":"Smith at Home","date":"2026-03-20","series":"location","tags":["cafe"],"description":"","cover":"/assets/snippets/location/8266fde0b459d4febbe4844853f0b556.jpg","review":"I visited after receiving a recommendation from YouTube. I was going to drink coffee, but personally, I don't prefer coffee with acidity, so I ordered Handmade Ginger Tea and Iced Milk Tea. I like warm healthy tea and was wondering what to drink, when the owner recommended the ginger tea they made themselves, so I ordered it without hesitation.","key":"862c9d5c9187e85247466e20bf726473","lang":"en"},{"file":"2026-03-20-location-restaurant-HaedongPorkRiceSoup","type":"snippets","title":"Haedong Pork Rice Soup","date":"2026-03-20","series":"location","tags":["restaurant"],"description":"","cover":"/assets/snippets/location/634f1f1bd81ee5bf496ef8f96918c0b2.jpg","review":"I visited this place after it was introduced on YouTube. If I hadn't seen the video, I would have definitely passed it by without a second thought. It's a pork rice soup restaurant, but uniquely, everyone orders pork belly.","key":"85fe431ce4e18fe1c8e5560140282053","lang":"en"},{"file":"2026-03-20-location-restaurant-HwangsanMilmyeon","type":"snippets","title":"Hwangsan Milmyeon","date":"2026-03-20","series":"location","tags":["restaurant"],"description":"","cover":"/assets/snippets/location/b6e68861d0263681f983afafd39a3e1b.jpg","review":"This is a place I always visit right after arriving at Busan Station. It opens at 10:30, and I always arrive around 10:10, take a walk around Busan Station, and do an \"open run\" right away. I naturally ordered the mul-milmyeon (cold wheat noodles).","key":"207d15348b5b573cb1ace9e61cb5639d","lang":"en"},{"file":"2026-03-20-location-restaurant-SinchangGukbapMainBranch","type":"snippets","title":"Sinchang Gukbap Main Branch","date":"2026-03-20","series":"location","tags":["restaurant"],"description":"","cover":"/assets/snippets/location/d1dc0cb33a749e370598d3274be2fc2e.jpg","review":"I visited the main branch of Sinchang Gukbap, one of the famous pork rice soup restaurants in Busan. I went to check it out after it was introduced on Michin Matjib (Crazy Good Restaurants). Since I visited during a late lunch hour on a weekday, luckily I could enter immediately without a wait.","key":"9da260dbd9c0fdde41a89140685db367","lang":"en"},{"file":"2026-03-21-location-cafe-Mooninthewaterflowerinthemirror","type":"snippets","title":"Suwol Gyeonghwa","date":"2026-03-21","series":"location","tags":["cafe"],"description":"","cover":"/assets/snippets/location/7eb23f0631873ded35bf2fb3e99f182d.jpg","review":"I visited this place after traveling on the Haeundae Beach Train. It wasn't a place I visited with high expectations, but the view was much better than I thought. At the entrance, there was a decoration showing the cafe's identity.","key":"ecc5fe5b527a2c5296518739c39ba17f","lang":"en"},{"file":"2026-03-21-location-cafe-TigerGelatoRiceCakeBusanHaeundaeMainStore","type":"snippets","title":"Tiger Gelato Rice Cake Busan Haeundae Main Store","date":"2026-03-21","series":"location","tags":["cafe"],"description":"","cover":"/assets/snippets/location/f40bb6523dd60e0f84b3c3cc4e6ba5d3.jpg","review":"I didn't intend to visit, but while wandering around because I had time before boarding the Haeundae Beach Train, the shop was about to open and there weren't many people waiting, so I joined the \"open run\" line immediately. While waiting for it to open, I looked through the menu and wondered which flavors to buy. It's a takeout-only shop, and I looked up the system to find that you can purchase from a minimum of 4 pieces.","key":"768611a726b8bc7fdc1e648e41ac9df4","lang":"en"},{"file":"2026-03-21-location-restaurant-SongheonHouse","type":"snippets","title":"Songheon House","date":"2026-03-21","series":"location","tags":["restaurant"],"description":"","cover":"/assets/snippets/location/0ae7822b06b3d451a5e277a0a1d61d8b.jpg","review":"It's said to be featured in the Michelin Guide Busan. Expecting a long wait, I visited before opening without much hope, but luckily there weren't many people waiting even on a weekend evening, so I immediately made a reservation using 'Catch Table' on-site. I was guided to a seat shortly after opening.","key":"dab595177716189e051185679bc0ee0f","lang":"en"},{"file":"2026-03-21-location-restaurant-SongjeongBeachMakguksuHaeundaeBranch","type":"snippets","title":"Songjeong Beach Makguksu Haeundae Branch","date":"2026-03-21","series":"location","tags":["restaurant"],"description":"","cover":"/assets/snippets/location/98b0de32b3a671edb52eb620d242f99c.jpg","review":"It's well known as a regular spot for the late Chung Ju-yung, honorary chairman of Hyundai Group, who enjoyed it so much that he would visit by helicopter whenever he was in Gangwon-do. Although the main restaurant is in Gangwon-do, I visited with confidence as it's a branch that inherited the same flavor. The mul-makguksu (cold buckwheat noodles in broth) is said to be characterized by its mild taste.","key":"b3a15058d920a1a80551aa3b7ad7cd82","lang":"en"},{"file":"2026-03-21-location-spot-SillyCorp","type":"snippets","title":"Juchaek Gongsa","date":"2026-03-21","series":"location","tags":["spot"],"description":"","cover":"/assets/snippets/location/b8f87dd641bc4ab23838b4b7247dec56.jpg","review":"I visited 'Juchaek Gongsa', a charming independent bookstore located in Millak-dong, Suyeong-gu, Busan. The most distinctive feature here is the Birthday Book Package. Based on the first edition publication date, they curate books released on the same month and day as your birthday (or the recipient's) and wrap them beautifully as blind books.","key":"1ab60c9bf10eb49496bf6774b6cdecb6","lang":"en"},{"file":"2026-03-24-stash-fixing-adb-remount-read-only-error","type":"snippets","title":"Fixing Read-only File System and ADB Remount Failure","date":"2026-03-24","series":"stash","tags":["aosp"],"description":"How to resolve 'read-only file system' errors by disabling dm-verity and remounting partitions via ADB.","cover":"","review":"A step-by-step guide on how to resolve the 'Read-only file system' error when modifying Android system partitions using the 'adb disable-verity' and 'remount' commands.","key":"966d5ea419ca991f1fef34c34dc767a3","lang":"en"},{"file":"2026-03-24-stash-pm2-startup","type":"snippets","title":"Configure PM2 Startup for Automatic Reboot","date":"2026-03-24","series":"stash","tags":["linux"],"description":"How to use 'pm2 startup' to ensure PM2 processes start automatically after a system reboot.","cover":"","review":"A summary of how to use the 'pm2 startup' command and the service registration process to ensure that processes managed by PM2 run automatically when the Linux system reboots.","key":"47a2686fa95b64e1413289bcc8756bb1","lang":"en"},{"file":"2026-03-27-screen-tv-LadyDua2026","type":"snippets","title":"Lady Dua (2026)","date":"2026-03-27","series":"screen","tags":["tv"],"description":"","cover":"/assets/snippets/screen/LadyDua2026.jpg","review":"Lady Dua is a thriller that depicts the cat-and-mouse suspense between a woman who wanted to become a perfect luxury item, even if fake, and a detective who relentlessly pursues the truth she holds. It sharply delves into heavy questions about truth by exploiting the vanity and desire hidden within modern people. As the truth is uncovered, her identity is gradually revealed, and the desires and psychology of the characters that emerge in the process are intriguing.","key":"2857ca040fad7c9f851024087dddafb0","lang":"en"},{"file":"2026-03-28-screen-movie-ProjectHailMary2026","type":"snippets","title":"Project Hail Mary (2026)","date":"2026-03-28","series":"screen","tags":["movie"],"description":"","cover":"/assets/snippets/screen/ProjectHailMary2026.jpg","review":"I watched Project Hail Mary, which I had thoroughly enjoyed reading as a book, after hearing it was released as a movie. In conclusion, I think it's a masterpiece that successfully adapted the original work into film. I've seen many movies that tried to visualize original novels, but this seems to be one of the best at expressing the source material.","key":"d40b9c0fbda36276eeb51ba925d96c84","lang":"en"},{"file":"2026-03-31-stash-adb-package-list-and-resolve-activity","type":"snippets","title":"Launching Activities via ADB","date":"2026-03-31","series":"stash","tags":["aosp"],"description":"How to launch a package via ADB commands.","cover":"","review":"Introduces how to launch specific packages and activities installed on an Android device directly from the command line using ADB commands.","key":"76c0362052a1ddafe70bcd40e8d03caa","lang":"en"}],"title":"# humanities"},"__N_SSG":true},"page":"/en/tags/[TagList]","query":{"TagList":"humanities-1"},"buildId":"-NeI8ViaEYGurXIIwzRtW","isFallback":false,"gsp":true,"scriptLoader":[]}</script></body></html>
