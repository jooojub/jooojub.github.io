:[{"file":"2013-06-01-screen-gods-quiz-1","type":"snippets","title":"신의 퀴즈 시즌 1 (2010)","date":"2013-06-01","series":"screen","tags":["tv"],"description":"","cover":"/assets/snippets/screen/gods-quiz-1.png","review":"메디컬 범죄 수사 장르를 성공적으로 개척한 기념비적인 시즌으로 평가되고 있다. 희귀병이라는 독특한 소재와 한진우라는 개성 있는 캐릭터가 이 드라마의 핵심인 것 같다.","key":"2c1c402846b0cc504c771b2d7b5bcf5a"},{"file":"2013-07-12-screen-gods-quiz-2","type":"snippets","title":"신의 퀴즈 시즌 2 (2011)","date":"2013-07-12","series":"screen","tags":["tv"],"description":"","cover":"/assets/snippets/screen/gods-quiz-2.png","review":"시즌 1에서 다져놓은 캐릭터가 흐트러지지 않고 잘 계승된 것 같다. 사건의 스케일과 구성이 한층 더 탄탄해졌다는 느낌을 받았다. 한진우라는 캐릭터의 세계관을 점점 확장한다.","key":"b5d41f59e2ca7cac9870b90da72fe05d"},{"file":"2013-08-07-screen-gods-quiz-3","type":"snippets","title":"신의 퀴즈 시즌 3 (2012)","date":"2013-08-07","series":"screen","tags":["tv"],"description":"","cover":"/assets/snippets/screen/gods-quiz-3.png","review":"한진우가 자신의 내면 속 또 다른 자아와 싸우는 과정이 큰 에피소드의 흐름 속에서 조금씩 나타난다. 팬텀이라는 새로운 캐릭터와 대결 구도가 그려지지만, 캐릭터 설정이 다소 억지스러운 감이 있다. 이번 시즌은 이전 시즌에 비해 다소 어둡다.","key":"55c71ee24e49f2d0f610822ba5051b0f"},{"file":"2014-12-20-screen-gods-quiz-4","type":"snippets","title":"신의 퀴즈 시즌 4 (2014)","date":"2014-12-20","series":"screen","tags":["tv"],"description":"","cover":"/assets/snippets/screen/gods-quiz-4.png","review":"코마에서 깨어난 한진우의 귀환과 함께, 이전 시즌들에 비해 드라마틱한 감동과 로맨스 라인이 강조된다. 하지만 여전히 다소 무겁다. 대중적인 재미와 사회적 약자에 대한 메시지의 균형을 잘 맞췄다.","key":"dac2bc0dc74a9cd1b71a339d15431eee"},{"file":"2015-11-07-screen-movie-ThePriests2015","type":"snippets","title":"검은 사제들 (2015)","date":"2015-11-07","series":"screen","tags":["movie"],"description":"","cover":"/assets/snippets/screen/ThePriests2015.jpg","review":"크게 기대하지는 않았었다. 한국에서는 실험적인 엑소시즘 소재와 부족한 재미 요소를 캐스팅으로 극복한 영화. 택시 번호나 빛과 어둠을 대비하여 표현한다든지 등의 디테일이 숨어 있는 듯하나, 내가 잘 모르는 세상이라 깊게 파고들지는 않았다.","key":"aa721f7e19941e15b0396fa81cc73392"},{"file":"2017-01-22-screen-tv-Goblin2016","type":"snippets","title":"도깨비 (2016)","date":"2017-01-22","series":"screen","tags":["tv"],"description":"","cover":"/assets/snippets/screen/Goblin2016.jpg","review":"멜로물을 좋아하진 않지만, 영상미가 좋아서 어쩌다 보니 여러 번 보게 되었다. 공유와 이동욱의 캐스팅이 절묘했다. 배우들의 뛰어난 연기력과 부드럽고 따뜻한 연출이 돋보였던 작품.","key":"e321299ad9384743060c4f045d60d144"},{"file":"2017-12-10-screen-tv-Black(2017)","type":"snippets","title":"블랙 (2017)","date":"2017-12-10","series":"screen","tags":["tv"],"description":"","cover":"/assets/snippets/screen/Black(2017).jpg","review":"소재는 좋았으나, 구성의 치밀함과 미리 깔아 놓는 떡밥이 너무 약하다. 특히 고유 번호 소재는 너무 빈약하고 억지스럽다. 발견되어야 한다는 기준이 명확할 수 없다.","key":"de964968d608a7bb8f643d8024e478d6"},{"file":"2019-02-13-screen-gods-quiz-5","type":"snippets","title":"신의 퀴즈 : 리부트 (2018)","date":"2019-02-13","series":"screen","tags":["tv"],"description":"","cover":"/assets/snippets/screen/gods-quiz-5.png","review":"시리즈의 정체성을 잃지 않으면서도 세련되게 부활했다. 인공지능이라는 개념을 부검에 도입하며 시대의 변화를 잘 반영했다. 악역끼리의 싸움에 주인공 등 터진 느낌이지만, 복수를 위한 악역을 응원하게 된다.","key":"8096a65cd8edcba357380c48a9626aac"},{"file":"2020-06-18-books-masquerade-hotel","type":"snippets","title":"매스커레이드 호텔","date":"2020-06-18","series":"books","tags":["mystery"],"description":"가면무도회","cover":"/assets/snippets/books/masquerade-hotel.png","review":"호텔은 불특정 다수가 드나드는 개방적인 공간이면서도, 각자의 객실이라는 비밀스러운 사적 공간이 공존하는 독특한 장소이다. 이러한 폐쇄적이면서도 개방적인 호텔이라는 공간은 미스터리를 위한 효과적인 장치임이 분명하다. 호텔을 찾는 손님들은 각자의 목적을 숨기기 위해 품위 있는 손님이라는 가면을 쓰고, 연쇄살인범을 쫓는 수사관들 역시 정체를 숨기고 친절한 호텔리어라는 가면을 쓴다.","key":"8edb454112aa536fe5b794cb8d0e99bb"},{"file":"2020-07-02-books-the-famous-detectives-rules","type":"snippets","title":"명탐정의 규칙","date":"2020-07-02","series":"books","tags":["mystery"],"description":"웃음이라는 보자기에 싼 비평의 칼날","cover":"/assets/snippets/books/the-famous-detectives-rules.png","review":"추리 소설 장르의 관습에서 벗어난 양심 선언적 소설에 가깝다. 작품의 주요 인물들이 자신들이 소설 속 등장인물이라는 사실을 인지하고 있다. 그들은 끊임없이 제4의 벽을 허물고 작가의 게으름, 진부한 플롯, 억지로 연기해야 하는 낡은 클리셰에 대해 불평을 쏟아낸다.","key":"9f60c1adfac782f6cfa0f5e8ea2424ee"},{"file":"2020-08-11-books-a-beautiful-weapon","type":"snippets","title":"아름다운 흉기","date":"2020-08-11","series":"books","tags":["thriller"],"description":"스포츠 정신의 타락과 인간성 상실","cover":"/assets/snippets/books/a-beautiful-weapon.png","review":"1등이 아니면 살아남을 수 없는 냉혹한 스포츠 세계를 배경으로 금메달이라는 아름다움을 위해 인간의 존엄성마저 내던진 인물들의 파멸을 보여준다. 도핑 문제와 생명 윤리, 그리고 성공 지상주의 사회에 대한 비판을 근간으로 한다. 죽음의 문턱에서 선수들은 자신들이 목숨을 걸고 지키려 했던 조작된 금메달과 트로피들이 한낱 잡동사니에 불과했음을 깨닫는다.","key":"b4e29d055c9c56edd0703557c7e2c325"},{"file":"2020-09-10-books-about-death","type":"snippets","title":"죽음에 관하여","date":"2020-09-10","series":"books","tags":["story"],"description":"삶과 죽음의 경계선, 그리고 지금 당신은 어떤 이야기를 들려줄 수 있나요?","cover":"/assets/snippets/books/about-death.png","review":"전지전능하지 않은 관찰자 신이 등장하며, 인간의 운명에 직접 개입하지는 않는다. 죽은 자를 살리거나 정해진 죽음을 막는 기적은 그의 역할이 아니다. 심판자가 아니라, 망자들이 스스로 자신의 삶을 되돌아보게 만드는 거울이다.","key":"2de94c794eb9336f66c6ef49c2a16524"},{"file":"2020-10-02-books-murder-by-the-lake","type":"snippets","title":"호숫가 살인사건","date":"2020-10-02","series":"books","tags":["mystery"],"description":"좋은 학교에 가지 않으면 손해만 볼 거라고 한 건 엄마잖아","cover":"/assets/snippets/books/murder-by-the-lake.png","review":"표면적인 살인 사건 이후, 상식과 이성을 마비시키는 집단적 광기를 그려낸다. 평범한 중산층으로 보이는 부모들이 어떻게 법과 도덕을 내던지고 시체 유기라는 극단적인 선택에 만장일치로 동참하게 되는지를 보여준다. 아이들의 시험이라는 명분 하나로 비상식적인 행동을 정당화한다.","key":"2481f6cf55a04d01f60476ce8f0d81ab"},{"file":"2020-10-17-books-jack-of-white-silver","type":"snippets","title":"백은의 잭","date":"2020-10-17","series":"books","tags":["thriller"],"description":"설산 시리즈의 서막","cover":"/assets/snippets/books/jack-of-white-silver.png","review":"스노보드 애호가로 알려진 작가의 개인적인 취향이 깊숙히 반영된 설산 시리즈의 첫 번째 작품이다. 광활한 설원은 외부 세계, 특히 경찰과 같은 공권력의 개입을 자연스럽게 차단하는 폐쇄적인 공간을 형성한다. 지리적 고립은 사건을 은폐가 가능한 환경적 기반이 되며, 내부 인물들만으로 위협에 맞서야 한다는 제한사항을 만들어준다.","key":"73c9bdd464fa5186b9bf825a8183f1e2"},{"file":"2020-11-06-books-fellow-student","type":"snippets","title":"동급생","date":"2020-11-06","series":"books","tags":["mystery"],"description":"청춘이라는 프리즘을 통해 본 인간 심리","cover":"/assets/snippets/books/fellow-student.png","review":"작가는 초등학생 때부터 교사를 아주 싫어했다고 한다. 작가의 과거 혐오와 불신의 교사가 이 작품에서 한 인물로 등장한 것 같다. 자신의 안위만을 최우선으로 여기는 위선자의 전형이다.","key":"aef39be85ecd2dc1e328e2eadba8d232"},{"file":"2020-11-23-books-the-red-finger","type":"snippets","title":"붉은 손가락","date":"2020-11-23","series":"books","tags":["mystery"],"description":"현대 가족을 비추는 거울","cover":"/assets/snippets/books/the-red-finger.png","review":"살인 사건이라는 극적인 장치를 통해 평범해 보이는 한 가족의 도덕적, 정서적 붕괴를 보여준다. 이 작품에서의 미스터리는 누가 범인인가가 아니라 어떻게 이 비극이 가능했는가인 듯하다. 이 작품에서는 사건의 범인이 초반에 공개되어, 작가가 의도적으로 작품의 핵심 질문이 누가가 아니라는 것을 밝힌다.","key":"4b34e9bf357a83632b486ea8d5d1b9ef"},{"file":"2020-12-14-books-one-of-them-killed-her","type":"snippets","title":"둘 중 누군가 그녀를 죽였다","date":"2020-12-14","series":"books","tags":["mystery"],"description":"독자에게 위임된 진실의 무게","cover":"/assets/snippets/books/one-of-them-killed-her.png","review":"범인의 이름이 밝혀지지 않은 채, 가가 형사의 모호한 뭐, 그냥 둘 중 한 명이 그녀를 죽였다고 해 두죠라는 말로 작품이 끝난다. 이 작품이 출간되었을 당시, 범인이 누구냐는 독자들의 문의 전화로 출판사가 마비되었을 정도라 한다. 작가는 독자에게 탐정과 동일한 정보와 단서를 텍스트를 통해 제공받는다.","key":"f2dc5d3ead6d7cb5acd286bf2b913d11"},{"file":"2021-01-02-books-premonitory-dream","type":"snippets","title":"예지몽","date":"2021-01-02","series":"books","tags":["mystery"],"description":"과학의 눈으로 오컬트를 해부하다","cover":"/assets/snippets/books/premonitory-dream.png","review":"예지몽, 유체이탈, 폴터가이스트 등 초자연적이고 신비주의적으로밖에는 해석할 수 없어 보이는 사건들을 갈릴레이의 과학적 원리로 설명한다. 단순한 트릭의 공개를 넘어 현대 사회에서 미신과 과학은 어떻게 공존하며 대립하는가라는 근원적인 질문을 던진다. 다섯 개의 독립된 단편으로 각기 다른 미스터리와 그에 적용되는 과학 원리를 설명한다.","key":"a0490fd8ec549842f5df5dec671ff649"},{"file":"2021-01-23-books-the-salvation-of-the-saint","type":"snippets","title":"성녀의 구제","date":"2021-01-23","series":"books","tags":["mystery"],"description":"구제와 단 하루의 단죄 - 허수해","cover":"/assets/snippets/books/the-salvation-of-the-saint.png","review":"탐정 갈릴레오의 두 번째 장편으로, 미스터리의 가장 고전적인 명제인 어떻게 죽였는가에 더욱 집중한 작품이다. 이 작품을 관통하는 두 개의 핵심 열쇠는 바로 허수해와 구제라는 개념이다. 허수해는 이론적으로는 가능하지만 현실에서는 결코 존재할 수 없는 해법, 즉 완전범죄를 상징한다.","key":"5fdd523cce8beae2c3e15c9db38cd79f"},{"file":"2021-02-12-books-storm-wind-and-blade","type":"snippets","title":"질풍론도","date":"2021-02-12","series":"books","tags":["thriller"],"description":"필사의 추격과 희극적 아이러니","cover":"/assets/snippets/books/storm-wind-and-blade.png","review":"작품 초반 지능적 범죄자와의 두뇌 싸움이라는 스릴러로 진행되려 했으나, 예측 불가능한 코미디의 영역으로 옮겨진다. 모든 책임을 떠맡은 어설픈 일반적인 무기력한 중년의 연구원이라는 미스 캐스팅은 다소 지루할 수 있는 사건에 희극적 긴장감의 장치로 사용한다. 어설프고 형편없는 그의 수상한 행동은 주변 인물들의 의심을 사며 의도치 않은 위기를 끊임없이 자초하게 된다.","key":"7c14cdffc9aa101c45ce64cc3aabd65d"},{"file":"2021-02-23-books-the-dangerous-venus","type":"snippets","title":"위험한 비너스","date":"2021-02-23","series":"books","tags":["mystery"],"description":"그것도 프랙털이었을까요","cover":"/assets/snippets/books/the-dangerous-venus.png","review":"수학과 뇌과학을 작품의 중심 소재로 가져왔다. 과학적 지식을 미스터리 장르와 결합하는 것이 그의 작품 세계를 규정하는 가장 큰 특징인 것 같다. 유산 상속이라는 고전 미스터리 클리셰를 내세워 독자의 주의를 분산시킨다.","key":"db3901be18a2035a4466916b0231b123"},{"file":"2021-03-02-books-fate","type":"snippets","title":"숙명","date":"2021-03-02","series":"books","tags":["mystery"],"description":"내게 어떤 피가 흐르는지는 관계없어. 중요한 건 내게 어떤 숙명이 주어졌는가야","cover":"/assets/snippets/books/fate.png","review":"살인 사건이라는 표면적 미스터리를 따라가며, 그 이면에 숨겨진 과학 윤리의 문제를 파고든다. 사건을 통해 초반에는 독자들에게 누가 범인인가, 어떤 트릭이 사용되었는가에 집중하게 만든다. 하지만 이야기가 흐를수록 이 사건의 본질은 단순한 범인 찾기가 아님이 명확해진다.","key":"1afee2e029b49b7e9a9d4efdbed8063d"},{"file":"2021-03-11-books-the-curse-of-the-great-detective","type":"snippets","title":"명탐정의 저주","date":"2021-03-11","series":"books","tags":["mystery"],"description":"현실과 허구의 경계 붕괴","cover":"/assets/snippets/books/the-curse-of-the-great-detective.png","review":"작가가 본격 미스터리라는 장르와 맺어온 애증의 관계를 총정리하고 자기성찰적인 작품에 가깝다고 한다. 원자력 발전소를 무대로 한 새로운 소설을 구상하던 작가 나는 자료 수집을 위해 도서관을 방문하는데, 그곳에서 길을 잃고 현실과는 다른 기묘한 세계로 빠져든다. 작가는 여기서 도서관은 지식의 전당이 아닌, 낡고 먼지 쌓인 책들이 가득한 책의 묘지라 표현한다.","key":"c93f7384702bc15827818aa43a62dc26"},{"file":"2021-03-20-books-malice","type":"snippets","title":"악의","date":"2021-03-20","series":"books","tags":["mystery"],"description":"조작된 동기에서 순수한 악의로","cover":"/assets/snippets/books/malice.png","review":"이 작품의 가장 큰 특징은 누가 범인인가를 과감히 폐기하고, 왜 범행을 저질렀는가라는 질문을 집요하게 파고든다는 점이다. 소설 초반에 범인이 누군지 밝혀지며, 독자들의 범인 찾기를 의도적으로 제거하여 독자의 시선을 동기 추적이라는 더 복잡하고 근원적인 미스터리로 강제 전환시킨다. 전지적 작가 시점이 아닌, 두 인물의 기록을 교차 제시하는 독특한 형식으로 전개된다.","key":"45d5ee01d71dab392edc8b372e6ea03b"},{"file":"2021-03-26-books-the-games-name-is-kidnapping","type":"snippets","title":"게임의 이름은 유괴","date":"2021-03-26","series":"books","tags":["mystery"],"description":"승자 없는 게임`","cover":"/assets/snippets/books/the-games-name-is-kidnapping.png","review":"정교한 서술 트릭과 반전을 극대화한 전통 추리 소설이다. 인질과 범인이 공모하여 벌이는 유괴극이라는 파격적인 설정을 하고, 이 모든 과정을 게임이라는 프레임으로 재구성한다. 이는 현대 사회의 인간관계와 모든 가치를 승패로 판단하는 차가운 세계관을 나타내는 듯하다.","key":"695c56209f354da2e85ad98ca82df740"},{"file":"2021-04-08-books-suspicious-people","type":"snippets","title":"수상한 사람들","date":"2021-04-08","series":"books","tags":["mystery"],"description":"인간의 마음은 얼마나 나약하고 위험할 수 있는가","cover":"/assets/snippets/books/suspicious-people.png","review":"총 7편의 단편집으로 구성되어 단순히 범인 찾기의 틀을 넘어, 평범한 일상 속에 숨겨진 인간의 어두운 욕망을 파고든다. 제목 그대로 모든 등장인물이 수상해 보이는 상황 속에서, 독자는 무엇이 진실이고 누구를 믿어야 하는가에 대한 질문을 하게 된다. 등장하는 인물들이 모두 의심스러운 정황과 동기를 지니고 있다. 즉 자연스럽게 모두가 용의자이다.","key":"bc3682172f608b1b39e8b9d5ec3aac03"},{"file":"2021-04-17-books-a-night-of-murder-without-a-perpetrator","type":"snippets","title":"범인 없는 살인의 밤","date":"2021-04-17","series":"books","tags":["mystery"],"description":"왜 그들은 죽음에 이르렀는가","cover":"/assets/snippets/books/a-night-of-murder-without-a-perpetrator.png","review":"작가의 초기 단편집으로 사소한 악의가 어떻게 파국적인 결과를 낳는가라는 하나의 강력한 주제를 가지고 있다. 거대한 음모나 사이코패스적인 악인이 아닌, 우리 주변에서 흔히 볼 수 있는 평범한 인물들의 내면에 깃든 악의 평범성을 탐구한다. 아주 작은 고의가 어떻게 나비효과처럼 증폭되어 돌이킬 수 없는 비극으로 치닫는 것을 추적한다.","key":"223d52912c576152418ba881bb5cd652"},{"file":"2021-04-22-books-i-killed-him","type":"snippets","title":"내가 그를 죽였다","date":"2021-04-22","series":"books","tags":["mystery"],"description":"오인에서 진실로","cover":"/assets/snippets/books/i-killed-him.png","review":"세 명의 각기 다른 인물이 등장하며, 이들 모두 각자의 방식으로 살해하려고 했고, 자신이 그의 죽음에 책임이 있다고 굳게 믿는다. 표면적으로는 두 명이 거짓말을 하거나 착각에 빠졌다고 생각하기 쉬우나, 작가는 인과성과 귀책성을 의도적으로 분리한 것 같다. 오직 한 명만 그의 죽음의 직접적인 원인을 제공했다.","key":"e2348ae6e247f5eda72c9439bf9d5801"},{"file 실체는 무엇인가'인 어떻게의 질문으로 전환시킨다. 독자는 탐정과 함께 진실을 추적하는 것이 아니라, 주인공의 편에 서서 그의 계획이 성공하기를 바라게 되는 공범자적 심리를 경험하게 한다. 피해자를 극악무도한 인물로 설정하고, 가해자를 보호받아야 할 존재로 설정하고 묘사하여 독자가 이러한 감정을 들도록 장치를 하였다.","key":"00a560f06c44f3d3f632cb9b63715a2b"},{"file":"2021-06-20-books-the-heart-of-brutus","type":"snippets","title":"브루투스의 심장","date":"2021-06-20","series":"books","tags":["mystery"],"description":"브루투스 너마저?","cover":"/assets/snippets/books/the-heart-of-brutus.png","review":"작품 전체를 배신이라는 키워드로 엮어낸다. 세 명의 공모자가 서로를 온전히 믿지 못하는 공모의 배신이 있다. 세 남자를 동시에 기만하며 자신의 이익을 추구하는 사랑의 배신이 존재한다.","key":"fd5da2c09e78d5f1ec981d81f6b477d8"},{"file":"2021-07-03-books-the-traffic-officers-night","type":"snippets","title":"교통경찰의 밤","date":"2021-07-03","series":"books","tags":["thriller"],"description":"운전대를 잡은 당신은 가해자인가, 피해자인가","cover":"/assets/snippets/books/the-traffic-officers-night.png","review":"이 작품은 교통법규 위반이라는 지극히 일상적인 소재를 현미경 삼아 인간의 이기심, 책임감, 그리고 법적 정의와 도덕적 정의 사이의 메울 수 없는 간극을 나타낸다. 이 작품은 여섯 편의 단편으로 이루어져 있으며 사소한 교통법규 위반이 돌이킬 수 없는 비극으로 증폭되는 과정을 보여준다. 특히 첫 번째 작품인 천사의 귀는 사회적 선입견에 의해 사건이 왜곡됨을 보여준다.","key":"6cf5e1cbf65214d4b8e7f17cf30efdd5"},{"file":"2021-07-14-books-lemon","type":"snippets","title":"레몬","date":"2021-07-14","series":"books","tags":["mystery"],"description":"나는 이 세상에서 유일한 인간이 아니다. 그러면 나라는 존재는 어떤 가치가 있는 걸까","cover":"/assets/snippets/books/lemon.png","review":"한국어판 제목은 원제 분신에서 레몬으로 다층적인 해석이 가능한 제목으로 변경되었다. 영미권 속어에서 레몬은 겉보기엔 멀쩡하지만 실상은 결함이 있는 불량품을 의미한다고 한다. 인간 존재의 근원을 파고드는 이 작품의 주제에 딱 맞는 제목 같다.","key":"09fe7a456a21519ee4087b30ed579d7b"},{"file":"2021-07-22-books-the-hollow-cross","type":"snippets","title":"공허한 십자가","date":"2021-07-22","series":"books","tags":["mystery"],"description":"십자가의 무게를 묻다","cover":"/assets/snippets/books/the-hollow-cross.png","review":"시간을 넘나드는 세 개의 살인 사건을 통해 하나의 거대한 비극을 완성한다. 각 사건은 독립적으로 보이지만, 과거의 원죄가 현재의 비극을 낳는 필연적인 인과관계로 묶여 있다. 소설의 다층적 서사 구조를 시간순으로 재구성하고, 이들이 어떻게 하나의 진실로 수렴되는지 분석한다.","key":"2dde601355f5a61fa681ac6f1bcee01a"},{"file":"2021-08-01-books-dream-painting","type":"snippets","title":"몽환화","date":"2021-08-01","series":"books","tags":["mystery"],"description":"나팔꽃에는 노란색이 없지","cover":"/assets/snippets/books/dream-painting.png","review":"등장인물이 많이 나오지만 다행히 화자는 세 사람이다. 역시 일본 소설은 가계도를 그려 가며 봐야 이해가 잘 된다. 프롤로그 1에서는 일명 MM 사건이라 불리는 묻지 마 살인 사건으로 이야기가 시작된다.","key":"22c7e7eb1c173d9bc0b31cb397e4a9cc"},{"file":"2021-08-12-books-white-night-journey","type":"snippets","title":"백야행","date":"2021-08-12","series":"books","tags":["thriller"],"description":"태양이 없는 낮을 걸어야만 했던 두 남녀의 이야기","cover":"/assets/snippets/books/white-night-journey.png","review":"마지막 장면에서 눈 하나 깜짝하지 않는 유키호의 마지막 모습이 충격과 슬픔이 함께 느껴진다. 그녀의 함혹함의 표현이자, 유일한 태양을 잃은 슬픔을 감추기 위한 최후의 몸부림일 것이다. 지독하고 어두우면서 처절하게 아름다운 명장면일 것이다.","key":"cb854cc3d1e386795fc22a80ff5d672a"},{"file":"2021-09-10-books-the-house-i-died-years-ago","type":"snippets","title":"옛날에 내가 죽은 집","date":"2021-09-10","series":"books","tags":["mystery"],"description":"그 집에 가야 한다","cover":"/assets/snippets/books/the-house-i-died-years-ago.png","review":"단 두 명의 등장인물과 한정된 공간이라는 극한의 설정 속에서 인간의 어두운 내면과 기억의 파편을 파고드는 고밀도 미스터리다. 작품 속에 흩뿌려진 단서들을 독자와 함께 모아보다 보면 마지막에 이르러 하나의 진실로 완벽하게 수렴되는 과정은 작가 특유의 플롯 구성 능력을 여실히 보여준다. 이 작품을 작가 스스로 본인의 야심작이라고 언급하였다.","key":"bb68813521bd7b8c2dd94e781a3bfa7d"},{"file":"2021-09-18-books-mrs-claus","type":"snippets","title":"산타 아줌마","date":"2021-09-18","series":"books","tags":["story"],"description":"아무튼 모두가 찬성","cover":"/assets/snippets/books/mrs-claus.png","review":"히가시노 게이고가 이런 책도 썼나 하며 집어든 골랐던 책이다. 당시 일본의 구시대적 발상에 도전을 내민 책이었을 것 같다. 산타는 꼭 남자여야 하는가로 시작하여 이렇게 우리가 당연시 여기는 고정관념은 또 어떤 것이 있는가 생각해볼 수 있는 작품이었다.","key":"8bf86092b0610ae2625ec8a27dab97ec"},{"file":"2021-09-20-books-there-are-happy-things-every-day","type":"snippets","title":"곰돌이 푸, 행복한 일은 매일 있어","date":"2021-09-20","series":"books","tags":["story"],"description":"기분이 우울해질 것 같아도 걱정하지 마. 그냥 배가 고픈 걸지도 몰라","cover":"/assets/snippets/books/there-are-happy-things-every-day.png","review":"힘이 들때 현실 속에서 힘이 되어주는 생각보다 간단한 말들로 위로를 받을 수 있는 책이다. T가 아닌 F를 위한 책. 힘든 상황에서 읽는다면 곰돌이 푸가 전하는 간단한 말들 중 위로받을 수 있는 말이 한두개씩은 있을 것이다.","key":"56cf68fa8e713711693c996c1d2908b8"},{"file":"2021-09-21-books-a-story-that-is-gone-now","type":"snippets","title":"지금은 없는 이야기","date":"2021-09-21","series":"books","tags":["story"],"description":"기존이 모든 우화를 뒤집는, 지금 우리에게 꼭 필요한 이야기","cover":"/assets/snippets/books/a-story-that-is-gone-now.png","review":"이 작품은 깊은 생각을 할 수 있게 만드는 작품이다. 독서 모임에서 이 작품을 통해 많은 토론과 이야기를 할 수 있었다. 불행한 소년은 천사의 가스라이팅을 마지막 순간에서야 깨닫게 된다.","key":"06952d0e8dbac481eb9c4a6f2debcdda"},{"file":"2021-10-01-books-the-courage-to-be-hated","type":"snippets","title":"미움받을 용기","date":"2021-10-01","series":"books","tags":["humanities"],"description":"인생의 모든 고민은 인간관계에서 비롯된다","cover":"/assets/snippets/books/the-courage-to-be-hated.png","review":"알프레드 아들러의 사상을 철학자와 청년의 대화라는 형식으로 쉽고 명쾌하게 풀어낸 책이다. 과거의 트라우마가 현재를 결정한다는 프로이트의 원인론을 정면으로 반박하며, 모든 것은 현재의 목적을 위해 스스로 선택한 것이라는 목적론적 관점을 제시한다. 트라우마에 대해서 너무 가볍게 생각하는 거 아닌가 하는 반발이 조금 들게 만드는 책이었다.","key":"ff496c9a8dfa5c224347cb7c53b4c028"},{"file":"2021-10-12-books-demian","type":"snippets","title":"데미안","date":"2021-10-12","series":"books","tags":["novel"],"description":"새는 알에서 나오려고 투쟁한다. 알은 세계다. 태어나려는 자는 하나의 세계를 파괴해야만 한다","cover":"/assets/snippets/books/demian.png","review":"평범한 소년이 자신의 내면에 존재하는 선과 악, 빛과 어둠을 모두 끌어안고 진정한 자기 자신에게로 나아가는 고통스럽고도 찬란한 성장 과정을 그린 20세기 최고의 성장 소설. 선과 악, 빛과 어둠 두 세계가 공존하는 세상에서 주인공 에밀 싱클레어의 두 세계의 충돌과 동시에 데미안이 등장한다. 아브락사스는 선과 악, 신적인 것과 악마적인 것을 모두 포함하는 신이 이 작품을 계속 관통하는 핵심인 것 같다.","key":"688d95ed7ee873ac6bfc1a4d2ba450cd"},{"file":"2021-10-22-books-twelve-footsteps","type":"snippets","title":"열두 발자국","date":"2021-10-22","series":"books","tags":["science"],"description":"생각의 모험으로 지성의 숲으로 지도 밖의 세계로 이끄는 열두 번의 강의","cover":"/assets/snippets/books/twelve-footsteps.png","review":"뇌과학을 좋아하면 절대 놓쳐서는 안 될 특강이다. 최근 관심사가 심리학에서 뇌과학으로 바뀌었다. 인간의 심리를 더욱 깊게 이해하려면 더욱 근본적인 뇌에 대해 알아야 하겠다고 생각했다.","key":"6567fb78d506a87e70dcfb403cc13342"},{"file":"2021-11-02-books-lesixieme-sommeil-1","type":"snippets","title":"잠 1","date":"2021-11-02","series":"books","tags":["SF"],"description":"우리가 꿈을 제어하거나, 꿈을 통해 과거로 갈 수 있다면 무슨 일이 벌어질까?","cover":"/assets/snippets/books/lesixieme-sommeil-1.png","review":"어렸을 때 자각몽(Lucid dream)에 한때 빠졌던 적이 있었다. 자는 시간이 너무 아까웠고 최대한 늦게 자거나 자는 시간도 활용하고 싶었다. 그래서 잠에 대해 관심이 많았고, 지루하지 않게 이 책을 읽었다.","key":"bcfa44c0c329999a1591e7c1f5bd21f9"},{"file":"2021-11-20-books-lesixieme-sommeil-2","type":"snippets","title":"잠 2","date":"2021-11-20","series":"books","tags":["SF"],"description":"잠의 마지막 단계에서 만난 과거, 현재, 미래","cover":"/assets/snippets/books/lesixieme-sommeil-2.png","review":"베르나르 작품은 소재의 신선함에 놀라고 너무 거창하고 억지스러운 마무리에 아쉬움이 남는다. 거대한 상상력의 용두사미 1권의 신선함에 비해 2권의 전개는 아쉬움이 남는다.","key":"159bdada6029cfb76d92599821dc9a88"},{"file":"2021-12-01-books-the-selfish-gene","type":"snippets","title":"이기적 유전자","date":"2021-12-01","series":"books","tags":["science"],"description":"인간은 유전자의 복제 욕구를 수행하기 위해 프로그래밍된 생존 기계일 뿐이다.","cover":"/assets/snippets/books/the-selfish-gene.png","review":"이 책 출간 이후 엄청난 충격과 영감을 동시에 안겨줬을 것이다. 진화의 주체를 개체나 종이 아닌 유전자로 보는 혁신적인 관점을 제시하며, 인간을 포함한 모든 생명체의 존재 이유와 본성을 완전히 새로운 시각으로 해석한다. 생물이 자신의 종의 생존 및 번영을 위해 행동한다고 착각했던 것들을 유전자 관점에서 해석하면 설명하기 힘들었던 부분들도 놀랍게도 설명이 가능해진다.","key":"aaf55e19595026b1b4f8bfaa295d2b3d"},{"file":"2022-01-02-books-the-kind-worth-killing","type":"snippets","title":"죽여 마땅한 사람들","date":"2022-01-02","series":"books","tags":["thriller"],"description":"당신은 세상을 위해 좋은 일을 하는 거예요","cover":"/assets/snippets/books/the-kind-worth-killing.png","review":"책을 읽으며 정말 죽여 마땅한 사람들의 인물들이지만, 과연 그렇다고 살인을 정당화할 수 있는가를 생각하게 되었다. 그렇다면 법의 심판을 통해 죽인다면 그건 정당화할 수 있고, 그들은 정말로 죽여 마땅한 사람들이었던 걸까? 그럼 죽여 마땅한 사람들이 있다는 것이고, 이것을 판단하는 근거가 개인이 아닌 다수의 동의와 약속이라면 죽일 수 있다는 것인가?","key":"c92a5a36438ec5a51ce60bad3c091c2e"},{"file":"2022-01-15-books-brave-new-world","type":"snippets","title":"멋진 신세계","date":"2022-01-15","series":"books","tags":["SF"],"description":"인간은 어느 만큼이나 인간일까?","cover":"/assets/snippets/books/brave-new-world.png","review":"이 작품은 행복과 자유라는 가치를 정면으로 충돌시킨다. 고통, 슬픔, 불안이 완전히 제거된 안정된 행복이 과연 인간적인 삶일까? 반대로 고뇌하고, 사랑에 아파하고, 죽음을 마주하는 불완전한 자유가 더 가치 있는 것일까? 독서 모임에서 이 작품처럼 멋진 신세계가 있다면 어떨지에 대해 질문을 던진 적이 있다.","key":"1eda0f619f7587ebf9337a5fef521388"},{"file":"2022-01-25-books-almond","type":"snippets","title":"아몬드","date":"2022-01-25","series":"books","tags":["novel"],"description":"차가운 머리와 뜨거운 가슴으로 쓴 성장 서사","cover":"/assets/snippets/books/almond.png","review":"공감 불능의 시대를 살아가는 우리에게 공감이란 무엇인지 근원적인 질문을 던지는 것 같다. 타인의 슬픔에 무감각해진 현대 사회의 모습을 날카롭게 꼬집는다. 이 책의 마지막 장면을 보면 갑자기 말도 안 되는 기적들이 일어나며 마무리가 된다.","key":"28af8adc1615df2e5de4140691696203"},{"file":"2022-02-01-books-gomtang-1","type":"snippets","title":"곰탕 1: 미래에서 온 살인자","date":"2022-02-01","series":"books","tags":["thriller"],"description":"어떻게든 여기서, 이 현재에 살고 싶었던 겁니다","cover":"/assets/snippets/books/gomtang-1.png","review":"배경은 2063년 부산으로 이야기는 시작된다. 과거로의 시간여행이 가능해지지만, 목숨을 걸어야 할 만큼 위험하다. 빈부 격차가 더욱 심해진 세상에서 부자들은 목숨을 걸고 시간여행을 갈 사람을 돈으로 산다.","key":"bdfed877ef95a0caf39b1fa5a83d16fc"},{"file":"2022-02-12-books-gomtang-2","type":"snippets","title":"곰탕 2: 열두 명이 사라진 밤","date":"2022-02-12","series":"books","tags":["thriller"],"description":"미래를 훔쳐 세운 유토피아, 그 속에서ㅍ피어난 잔혹한 진실과 뒤늦은 회한","cover":"/assets/snippets/books/gomtang-2.png","review":"영화감독답게 속도감이 있다. 1권에서 차곡차곡 쌓아올린 떡밥들을 회수하며 빠르게 이야기를 전개한다. 자신이 생각하는 유토피아를 건설하기 위해 많은 이들을 희생시킨다.","key":"5cc0e5bc970e0f6fa42371e7d2836b28"},{"file":"2022-02-20-books-28","type":"snippets","title":"28","date":"2022-02-20","series":"books","tags":["thriller"],"description":"단지 모두 살아남고자 했던 것이다","cover":"/assets/snippets/books/28.png","review":"팬데믹이라는 상황 속에서 살아남고자 하는 인간들의 민낯을 잘 보여주는 작품이다. 전염병 적안이 개들 사이에 퍼져 나가고, 인간으로 전염되기 시작한다.  개들을 서슴없이 학살하는 인간들이 지독하게 묘사된다.","key":"0ecb8b6c36e7b2d1cb5f930218bf5c02"},{"file":"2022-03-02-books-the-origin-of-species","type":"snippets","title":"종의 기원","date":"2022-03-02","series":"books","tags":["thriller"],"description":"포식자의 탄생, 그 3일간의 기록","cover":"/assets/snippets/books/the-origin-of-species.png","review":"자신의 집에서 피 냄새를 맡으며 잠에서 깨어나는 장면으로 작품은 시작된다. 전날 밤부터의 기억이 끊겨 있고, 자신의 온몸은 피투성이다. 아래층으로 내려간 그는 면도칼에 목이 그여 살해된 어머니의 시신을 발견한다.","key":"18105a33e74bf8d1419bf29077dcd448"},{"file":"2022-03-10-books-and-then-there-were-none","type":"snippets","title":"그리고 아무도 없었다","date":"2022-03-10","series":"books","tags":["mystery"],"description":"완벽한 범죄, 섬뜩한 심판","cover":"/assets/snippets/books/and-then-there-were-none.png","review":"세계 3대 추리소설 중 하나로 불리는 작품으로 시대를 초월한 걸작이라는 생각이 든다. 이야기는 서로 아무런 연관이 없어 보이는 8명의 남녀가 'U. N. 오언(U. N. Owen)'이라는 의문의 인물로부터 데번 해안의 외딴 섬, '인디언 섬'의 호화로운 저택으로 초대받으면서 시작된다. 섬에 도착한 이들은 자신들을 초대한 주인이 부재중이며, 먼저 와 있던 하인 부부만이 그들을 맞이하는 것을 알게 된다.","key":"0f4f775e4254c0bac6aa9f4c87c98576"},{"file":"2022-03-20-books-seven-years-of-night","type":"snippets","title":"7년의 밤","date":"2022-03-20","series":"books","tags":["thriller"],"description":"한순간의 실수로 인해 파멸의 질주를 멈출 수 없었던 한 사내의 이야기","cover":"/assets/snippets/books/seven-years-of-night.png","review":"정유정 작가님의 작품을 읽으면 숨이 막힌다. 등장 인물들의 상황과 그 감정 묘사가 너무 생생하여 읽을 때 힘이 든다. 최현수라는 한 인물의 하룻밤의 끔찍한 실수가 모든 비극의 씨앗이 된다.","key":"56ee1333b926e77b15dcaa86a36ab527"},{"file":"2022-03-25-books-the-ABC-murders","type":"snippets","title":"ABC 살인 사건","date":"2022-03-25","series":"books","tags":["mystery"],"description":"광기의 장막 뒤에 숨겨진 단 하나 진실","cover":"/assets/snippets/books/the-ABC-murders.png","review":"에르퀼 푸아로에게 A.B.C.라는 서명을 단 익명의 편지 한 통이 도착하면서 시작된다. 편지에는 특정 날짜에 앤도버(Andover)에서 벌어질 사건을 예고하며 푸아로를 조롱한다. 경찰은 장난으로 치부하지만, 실제로 예고된 날짜에 앤도버에서 담배 가게를 운영하던 앨리스 애셔(Alice Ascher)가 살해된 채 발견된다.","key":"615689798bb5079fa153081c54f59dc0"},{"file":"2022-04-02-books-murder-on-the-orient-express","type":"snippets","title":"오리엔트 특급살인","date":"2022-04-02","series":"books","tags":["mystery"],"description":"법의 정의와 인간의 정의 사이에서 일생일대의 선택을 마주한다","cover":"/assets/snippets/books/murder-on-the-orient-express.png","review":"에르퀼 푸아로가 등장하는 대표 작품으로, 완벽하게 닫힌 공간인 열차 안에서 살인사건이 일어난다. 외부인의 침입 흔적이 전혀 없으며, 용의자 12명을 차례로 심문하지만 용의자 전원에게는 서로가 서로의 증인이 되어주는 완벽한 알리바이가 존재한다. 그리고 범행 현장에서는 주인 없는 손수건, 파이프 클리너, 심지어 강도와 깊이가 제각각인 열두 개의 자상 등 서로 모순되는 단서들만 발견된다.","key":"cc4ae58f497715450f4a83dcf2356a76"},{"file":"2022-04-10-books-such-unexpected-neuroscience","type":"snippets","title":"이토록 뜻밖의 뇌과학","date":"2022-04-10","series":"books","tags":["science"],"description":"뇌를 안다는 것은, 나와 인간을 안다는 것","cover":"/assets/snippets/books/such-unexpected-neuroscience.png","review":"당신의 뇌는 생각하기 위해 존재하지 않는다 이 책에서 가장 충격적이고 핵심적인 내용인 것 같다. 뇌의 가장 중요한 임무는 생각이 아니라, 알로스타시스(Allostasis), 즉 신체 예산을 효율적으로 관리하는 것이다.","key":"c1c33a278c3fc8abe7beb8410310accf"},{"file":"2022-04-20-books-endless-night","type":"snippets","title":"끝없는 밤","date":"2022-04-20","series":"books","tags":["mystery"],"description":"Some are Born to Endless Night","cover":"/assets/snippets/books/endless-night.png","review":"마이클 로저스의 1인칭 시점으로 전개가 되는 소설이다. 독자는 마지막 순간까지 주인공 마이클에게 감정을 이입하고 그의 시선으로 세상을 본다. 그렇기에 진실이 밝혀졌을 때 더욱 충격적인 반전을 선사해주고 판단력에 혼란을 불러일으킨다. 애크로이드 살인사건과 비슷한 전개이다.","key":"4d087452dfa3b2f8ba7bb4bc01b7ee3e"},{"file":"2022-04-25-books-towards-midnight","type":"snippets","title":"0시를 향하여","date":"2022-04-25","series":"books","tags":["mystery"],"description":"차근차근 조여 오는 시간 속에서","cover":"/assets/snippets/books/towards-midnight.png","review":"진범의 반전과 그 뒤 진정한 흑막이 충격적인 결말을 가져오는 작품이다. 다층적 트릭과 반전으로 독자를 두 번 속이는 정교한 트릭이다. 이것이 바로 트릭의 여왕. 인간 내면의 어둠을 잘 나타낸 심리 묘사도 돋보인다.","key":"ea27778f154c69885507a1b1b6e1da3e"},{"file":"2022-05-02-books-closed-room-murder-game_1","type":"snippets","title":"밀실살인게임 왕수비차잡기","date":"2022-05-02","series":"books","tags":["mystery"],"description":"죽이고 싶은 인간이 있어서 죽인 게 아니라 써보고 싶은 트릭이 있어서 죽였지","cover":"/assets/snippets/books/closed-room-murder-game_1.png","review":"인터넷상에 익명의 5명이 모여 살인 추리 게임을 한다. 각자 한 명이 범인을 맡으며 살인 사건을 문제로 내면 나머지가 푸는 형태이다. 하지만 그 살인 사건의 문제는 가상의 문제가 아닌 범인 역할을 맡은 인물이 실제로 일으킨 살인 사건이다.","key":"c58f5b4151e83129036360fb6639499f"},{"file":"2022-05-10-books-the-murder-of-roger-ackroyd","type":"snippets","title":"애크로이드 살인사건","date":"2022-05-10","series":"books","tags":["mystery"],"description":"진실은 늘 곁에 있었지만, 우리는 보지 않았다","cover":"/assets/snippets/books/the-murder-of-roger-ackroyd.png","review":"스토리 자체보다는 작품을 전개한 방식이 그 당시에는 신선했다고 한다. 현대에는 이러한 방식의 서술 트릭이 놀랍지 않을 수도 있지만, 당시에는 독자와 평론가 모두 놀랐다고 한다. 아서 코난 도일조차 이 작품에 감탄했다고 한다.","key":"1ff2d1aa549f5ee3c48b5c3de768fc5c"},{"file":"2022-05-16-books-a-murder-is-announced","type":"snippets","title":"살인을 예고합니다","date":"2022-05-16","series":"books","tags":["mystery"],"description":"살인이 예고됩니다. 날짜는 10월 29일 금요일, 오후 6시 30분. 장소는 리틀 패덕스. 관심 있는 분은 오시길 바랍니다","cover":"/assets/snippets/books/a-murder-is-announced.png","review":"신문 광고로 살인을 예고한다는 설정이 독창적이다. \u003e “살인이 예고됩니다. 날짜는 10월 29일 금요일, 오후 6시 30분. 장소는 리틀 패덕스. 관심 있는 분은 오시기 바랍니다.” 주민들은 이 광고를 연극이거나 장난이라고 생각하고, 일부는 호기심에 정말 리틀 패덕스 저택에 찾아온다.","key":"3cb9502d8a91746f92fe9b379a525894"},{"file":"2022-05-22-books-change","type":"snippets","title":"변신","date":"2022-05-22","series":"books","tags":["thriller"],"description":"뇌를 전부 교체하면 어떻게 될까? 그래도 넌 계속 너일까?","cover":"/assets/snippets/books/change.png","review":"뇌 이식 후 점점 달라지는 자신의 모습을 보며 주인공도 스스로 혼란에 빠진다. 식성도 바뀌었고, 차분하던 성격이 분노를 통제하기 힘든 성격으로 바뀌었다. 그림에 대한 재능과 흥미도 잃었고, 연인에 대한 애정도 없어졌다.","key":"ba02fdf0afa8412f19d115914ae9c01b"},{"file":"2022-06-01-books-phantom-lady","type":"snippets","title":"환상의 여인","date":"2022-06-01","series":"books","tags":["mystery"],"description":"‘환상의 여인’은 어디에 있는가?","cover":"/assets/snippets/books/phantom-lady.png","review":"세계 3대 추리소설로 꼽히는 책 중 하나. 아내와 다툰 주인공이 혼자 거리를 헤매던 중 우연히 오렌지색의 모자를 쓴 여인을 만나 식사를 하고 극장에 간다. 주인공은 여인과 헤어지고 집에 돌아왔는데, 아내가 침실에서 시체로 발견되고 당연히 첫 번째 용의자로 주인공이 지목된다.","key":"1ab9fdee80e45c6b02f6ef1e0c7ddfb8"},{"file":"2022-06-08-books-black-cat","type":"snippets","title":"검은고양이","date":"2022-06-08","series":"books","tags":["mystery"],"description":"가장 끔찍스럽지만 역시 가장 솔직한 이야기에 대해서 믿어주기를 기대하거나 간청하지 않는다","cover":"/assets/snippets/books/black-cat.png","review":"이름은 많이 들어본 에드거 앨런 포 작가의 대표 단편 소설이다. 작가의 작품을 처음 접한 첫 느낌은 공포와 어두움이었다. 사실 검은 고양이 부분만 읽고 딱히 내 스타일이 아니라는 걸 느끼고 나머지 단편 작품도 읽었다.","key":"2d13ab8a34132a4a3afecf223ad218dd"},{"file":"2022-06-15-books-the-boy-who-plays-the-rainbow","type":"snippets","title":"무지개를 연주하는 소년","date":"2022-06-15","series":"books","tags":["thriller"],"description":"나는 사람들을 눈뜨게 하고 싶었어. 인간 모두가 다음 진화의 열쇠를 손에 쥐고 있거든","cover":"/assets/snippets/books/the-boy-who-plays-the-rainbow.png","review":"빛 연주, 즉 광악에 메시지를 담아 발산한다는 소재가 신선하고 마음에 들었다. 특히 광악이라는 용어 자체가 신선했다. 하지만 스토리 자체는 신선하지 않았다.","key":"dba20e2e9b9e80cde715f341b58762c1"},{"file":"2022-06-25-books-science-concert","type":"snippets","title":"정재승의 과학 콘서트","date":"2022-06-25","series":"books","tags":["science"],"description":"복잡한 세상 명쾌한 과학 ","cover":"/assets/snippets/books/science-concert.png","review":"일상 속 과학을 재미있게 풀어주는 과학 책. 과학을 딱딱하지 않고 재미있는 일상으로 풀어나간다. 예전에는 심리학을 좋아했지만 이제는 뇌 과학이 더 눈길이 간다.","key":"776d6ab08a3e829483616cfe7fc200c5"},{"file":"2022-07-02-books-crooked-house","type":"snippets","title":"비뚤어진 집","date":"2022-07-02","series":"books","tags":["mystery"],"description":"괴물은 밖에 있는 게 아니라, 집 안에 있다","cover":"/assets/snippets/books/crooked-house.png","review":"살해 동기와 범인이 충격적이었던 작품이다. 쾌감과 통제를 위해 살인을 저지르는 사이코패스적 성향이 나온다. 심지어 이 모든 범행을 수첩에 일기처럼 정리하는 모습에서 오늘날 정의되는 사이코패스에 부합하는 행동으로 보인다.","key":"41f3bb8844bcf530cb6844c3fef9da69"},{"file":"2022-07-10-books-false-accusation","type":"snippets","title":"누명","date":"2022-07-10","series":"books","tags":["mystery"],"description":"진실은 정의의 승리가 아닌, 모든 것을 파괴하는 고통이었다","cover":"/assets/snippets/books/false-accusation.png","review":"가족 구성원의 무죄가 입증이 됐는데, 기뻐하기보단 오히려 평화로워진 집안에 혼란이 다시 왔다는 것이 불쾌하고 불편하다. 불편한 진실이다. 재코는 누명을 쓰긴 했지만 억울하진 않았을 것이다.","key":"a77695b51f438b9069e19a3f7fb600ae"},{"file":"2022-07-19-books-jini-genie","type":"snippets","title":"진이, 지니","date":"2022-07-19","series":"books","tags":["novel"],"description":"운명의 소용돌이 속에 던져진 두 개의 영혼, 삶과 죽음의 경계를 넘어 따스하게 공명하다","cover":"/assets/snippets/books/jini-genie.png","review":"정유정 작가님의 따뜻하고도 깊은 교훈이 있는 소설이다. 작가님은 동물에 대한 애착이 남다르신 것 같다. 28에 나오는 동물들의 묘사 장면을 읽으며 힘든 감정을 느꼈었다면, 이번 작품에서는 조금은 유쾌하고 발랄한 느낌을 받았다. 앞서 읽은 작가님의 28과 종의 기원, 그리고 7년의 밤과는 조금 다른 분위기이며 인상 찌푸리지 않고 볼 수 있는 작품이라 새로웠다.","key":"f8c0d09589cdb5d7e3efcf4960db41bc"},{"file":"2022-07-20-books-the-demand-for-depth","type":"snippets","title":"깊이에의 강요","date":"2022-07-20","series":"books","tags":["novel"],"description":"깊이가 없다","cover":"/assets/snippets/books/the-demand-for-depth.png","review":"군더더기 없는 짧은 단편소설. 짧지만 강렬하고 임팩트 있으며 울림이 깊다. 책에서는 예술가와 평론가로 표현되지만, 이러한 이중성은 어디에나 존재한다. 깊이가 삶의 깊이를 측정하는 잣대가 되어 사회적 조건이 개인의 삶까지 야금야금 갉아먹는 현실을 보여준다.","key":"dbd9ea16f1647a0b334e582283334fb4"},{"file":"2022-07-25-books-moving-finger","type":"snippets","title":"움직이는 손가락","date":"2022-07-25","series":"books","tags":["mystery"],"description":"작은 시골 마을, 편지 한 통이 불신과 살인을 퍼트린다. 손가락은 이미 움직였다","cover":"/assets/snippets/books/moving-finger.png","review":"편지라는 익명 도구를 통해 평범함을 파괴하는 힘을 탁월하게 묘사한 작품이다. 현대 사회에서도 문제가 되는 가십, 익명 비난 문화와도 맞닿아 있는 예리한 통찰을 담고 있는 책이다. 통신의 발달로 이러한 문제는 과거에 비해 더욱 악랄해지고 비열해졌을 것이다.","key":"95a9e9477ec27dff1c4a6fe9a715197b"},{"file":"2022-08-04-books-metamorphosis","type":"snippets","title":"변신","date":"2022-08-04","series":"books","tags":["novel"],"description":"쓸모없는 존재","cover":"/assets/snippets/books/metamorphosis.png","review":"집안의 가장으로서 가족을 부양하며 성실하게 살아왔지만, 괴물로 변하자마자 가족들은 점점 그를 거부하고 혐오하게 된다. 시간이 흐르면서 그는 방 안에 갇힌 채 점점 쇠약해지고, 아무도 슬퍼하지 않는 죽음을 맞이한다. 가족은 그가 죽자마자 안도하며 새로운 시작을 준비한다.","key":"2dec82d7028ff6db8c8f153a7da0daec"},{"file":"2022-08-11-books-four-knocks","type":"snippets","title":"네 번의 노크","date":"2022-08-11","series":"books","tags":["thriller"],"description":"첫 방문일 때는 노크 네 번이 적당하다","cover":"/assets/snippets/books/four-knocks.png","review":"알라딘 중고서점에서 계산을 위해 카운터에 갔는데, 옆에 알라딘 직원들의 추천 도서로 소개되어 있어서 무심코 같이 구매했다. 사건 자체와 재미 요소는 좋으나, 어딘가 조금 가볍다. 하지만 내사와 용의자들의 독백을 나눈 부분이 몰입감에 도움이 되었다.","key":"2c3650fb310a44308c3969b673ab6724"},{"file":"2022-08-22-books-the-tragedy-of-y","type":"snippets","title":"Y의 비극","date":"2022-08-22","series":"books","tags":["mystery"],"description":"달콤한 바닐라 향","cover":"/assets/snippets/books/the-tragedy-of-y.png","review":"세계 3대 추리 소설 중 한 작품이다. 워낙 유명한 작품이지만, 생각보다 손에 잡히지 않아서 읽지 않았다가 알라딘 중고서점에서 우연히 눈에 띄어 읽기를 결심했었다. 사건이 흘러가는 방향과 탐정의 추리가 억지스럽지 않고 납득할 만하다.","key":"1741fda0a2c824c51d1cd029b232e762"},{"file":"2022-08-29-books-meditation-murder","type":"snippets","title":"명상 살인","date":"2022-08-29","series":"books","tags":["thriller"],"description":"나는 42세가 되어서야 첫 살인을 했다. 나는 변호사이고 내 의뢰인을 죽였다","cover":"/assets/snippets/books/meditation-murder.png","review":"처음 제목을 접했을 때는 명상으로 사람을 원격으로 살인하는 내용인 줄 알았다. 살인을 저지르고 명상으로 냉정해지며 위기를 극복하는 명상 살인이었다. 물론 명상 때문에 사건이 시작된 것일 수도 있다.","key":"378964a3d0315a3e5dd04926f0d0fb3a"},{"file":"2022-09-09-books-behind-doors","type":"snippets","title":"비하인드 도어","date":"2022-09-09","series":"books","tags":["thriller"],"description":"“당신이 믿는 그 사람은 사이코패스다","cover":"/assets/snippets/books/behind-doors.png","review":"여자 주인공의 절망스러운 감정과 공포가 고스란히 느껴진다. 책을 읽는 내내 답답한 마음이었다. 빠져나갈 수 없는 덫에 걸린 기분이랄까? 우리가 모르는 세상에도 비슷한 사례가 많이 있을 것 같다. 아니, 분명 있다. 단지 사건이 터지기 전까지 우리가 인지하지 못하고 있는 것일 것이다.","key":"9594a5ee90b8c21d94cb7d3a415e95f8"},{"file":"2022-09-15-books-the-therapist","type":"snippets","title":"테라피스트","date":"2022-09-15","series":"books","tags":["thriller"],"description":"아무도 믿지 말아요","cover":"/assets/snippets/books/the-therapist.png","review":"반전을 위해 복선을 잘 깔아 두었다. 과거 사건을 두고 주인공이 누구도 믿지 못하고 의심한다. 역시 많은 것을 알고 있는 인물은 의심과 질투를 많이 산다. 심리상담가는 쉽지 않은 직업임이 분명하다.","key":"7793cd7147e54abfa5c937304f49f6c9"},{"file":"2023-01-03-screen-heros-movie-2022","type":"snippets","title":"영웅 (2022)","date":"2023-01-03","series":"screen","tags":["movie"],"description":"","cover":"/assets/snippets/screen/heros-movie-2022.png","review":"역시 영화보다는 역시 뮤지컬로 봐야 한다는 생각이 들었다. 하지만 잊지 말아야 할 역사적 사실을 직시해야 한다는 의무감으로 관람했다. 기회가 된다면 꼭 뮤지컬을 관람해야겠다.","key":"b4fe7c5c8338ae658f85417e0af44ce9"},{"file":"2023-01-28-screen-puss-in-boots-the-last-wish","type":"snippets","title":"장화신은 고양이: 끝내주는 모험 (2022)","date":"2023-01-28","series":"screen","tags":["movie"],"description":"","cover":"/assets/snippets/screen/puss-in-boots-the-last-wish.png","review":"해맑은 강아지 캐릭터를 보며 예상치 못한 눈물이 났다. 아무 생각 없이 보기에는 의외로 생각할 거리가 많은 영화다. 등장하는 캐릭터들이 하나같이 모두 매력적이다.","key":"ad348379e7ab47aab23a50f0703420fa"},{"file":"2023-03-21-books-too-loud-a-solitude","type":"snippets","title":"너무 시끄러운 고독","date":"2023-03-21","series":"books","tags":["novel"],"description":"삼십오 년째 책과 폐지를 압축하느라 활자에 찌든 나는, 그동안 내 손으로 압축한 책들과 흡사한 모습이 되어버렸다","cover":"/assets/snippets/books/too-loud-a-solitude.png","review":"책 도입에는 솔직히 내용을 정확히 이해하지 못한 채 읽어 내려갔다. 하지만 점점 주인공의 고독이 느껴졌다. 책 제목이 너무 마음에 든다. 이 책을 통해 전달하려는 내용이 잘 드러난 제목이다.","key":"16f6eaaa34045f5588f69d9c8dafeabf"},{"file":"2023-07-03-screen-elemental","type":"snippets","title":"엘리멘탈 (2023)","date":"2023-07-03","series":"screen","tags":["movie"],"description":"","cover":"/assets/snippets/screen/elemental.png","review":"디테일이 살아 숨 쉬는 놀라운 애니메이션이다. 영화 곳곳에 자연스럽게 녹아든 한국적인 요소들을 찾는 재미가 쏠쏠하다. 개인적으로 큰 의미가 있는 영화이다.","key":"6c7df8028e5b9c931bff13c1150a1ed4"},{"file":"2023-07-12-books-white-light","type":"snippets","title":"백광","date":"2023-09-22","series":"books","tags":["mystery"],"description":"저 아이를 죽여 주세요","cover":"/assets/snippets/books/white-light.png","review":"네 살 난 여자아이의 시체가 발견되고, 그 용의자로 아이의 가족과 낯선 남자 한 명이 용의자에 오른다. 아이가 살해당했지만 슬퍼하기보다는 자신들의 혐의를 부인하기 급급하다. 용의자들이 조사를 받을 때마다 범인이 바뀐다.","key":"9b30064906bdbb5f44d784ea5a754f5f"},{"file":"2023-07-26-books-if-we-cannot-moveat-the-speeod-of-light","type":"snippets","title":"우리가 빛의 속도로 갈 수 없다면","date":"2023-07-26","series":"books","tags":["SF"],"description":"사연을 아는 사람들은 내게 수십 년 동안 찾아와 위로의 말을 건넸다네. 그래도 당신들은 같은 우주 안에 있는 것이라고, 그 사실을 위안 삼으라고","cover":"/assets/snippets/books/if-we-cannot-moveat-the-speeod-of-light.png","review":"독서 모임에서 추천받아서 읽은 책이다. 책을 추천받았다기보다는 김초엽 작가님을 추천받았다. 단편집이라 작가님의 스타일을 한 권에 느낄 수 있어서 좋았다. 다른 작품도 읽어봐야겠다.","key":"6d867664c7ea1fa640d928d340fdf164"},{"file":"2023-08-15-screen-oppenheimer","type":"snippets","title":"오펜하이머 (2023)","date":"2023-08-15","series":"screen","tags":["movie"],"description":"","cover":"/assets/snippets/screen/oppenheimer.png","review":"거장의 영화는 역시 다르다는 말이 절로 나올 만큼 압도적이다. 사전 지식을 조금만 공부하고 본다면 영화의 진가를 더욱 깊이 느낄 수 있다. 핵폭발의 위력을 확인한 과학자들의 고뇌와 복잡한 심리를 탁월하게 표현해냈다.","key":"298a947128541f461efa69131342b206"},{"file":"2023-09-01-books-bat","type":"snippets","title":"박쥐","date":"2023-09-01","series":"books","tags":["thriller"],"description":"아무도 환영해주지 않는 지구 반대편, 누구도 슬퍼해주지 않는 사건 현장","cover":"/assets/snippets/books/bat.png","review":"해리 홀레 시리즈 중 스노우맨이라는 작품이 재미있다고 해서, 어쩔 수 없이 해리 홀레 시리즈 1부터 봤다. 해리 홀레 형사의 캐릭터에 대한 묘사와 과거 이야기들이 조금씩 나온다. 알코올 의존증이 있고 흔들리는 젋은 형사로 표현되며 독자들에게 매력적인 인물로 그려진다.","key":"f52bbd8e74c6a9de2bca06ce6cd6a39b"},{"file":"2023-09-18-books-cursed-bunny","type":"snippets","title":"저주토끼","date":"2023-09-18","series":"books","tags":["mystery"],"description":"저주에 쓰이는 물건일수록 예쁘게 만들어야 하는 법이다","cover":"/assets/snippets/books/cursed-bunny.png","review":"2022 부커상 후보에 오른 책이라는 광고에 구매해버린 책. 다소 생소한 한국 작가님의 단편 소설집으로, 10편의 작품 모두 난해하고 신선하다. 호러라고 해야 할지 SF라고 해야 할지... 작품 하나하나 읽고 생각하는 시간이 조금 필요하다.","key":"92b555289f7525d11d524dc83a21774f"},{"file":"2023-10-05-books-greenhouse-at-the-end-of-the-world","type":"snippets","title":"지구 끝의 온실","date":"2023-10-05","series":"books","tags":["SF"],"description":"인류 대멸종 이후 재건 60주년, 갑자기 증식한 푸른 빛 식물의 진실을 알고 있다는 의문의 메일 한 통","cover":"/assets/snippets/books/greenhouse-at-the-end-of-the-world.png","review":"더스트(Dust)라는 치명적인 독성 나노 먼지로 멸망 위기의 세대 이야기. SF의 단골 소재는 역시나 인류의 멸망. 연출만 가능하다면 영화로 나올 수 있는 소재와 재미 요소가 있는 것 같다.","key":"d7a5a50994f14c2e3be587834a1ea3ee"},{"file":"2023-10-12-books-memory-bookstore","type":"snippets","title":"기억 서점","date":"2023-10-12","series":"books","tags":["thriller"],"description":"죽음을 기억하는 한 남자의 집요하고 지적인 복수극","cover":"/assets/snippets/books/memory-bookstore.png","review":"복수를 위해 서점을 열었다. 딱 이 부분만 신선했다. 너무 뻔한 스토리와 뻔한 반전, 그리고 불필요해 보이는 복수 장면. 어떤 재미 요소와 반전을 넣고 싶었는지는 알겠으나 너무 가볍고 쉽다.","key":"7b9598f77ea8a4ee277b5aeeccede300"},{"file":"2023-11-01-books-little-prince","type":"snippets","title":"어린 왕자","date":"2023-11-01","series":"books","tags":["novel"],"description":"그래서 난 좀 지겨워. 그러나 네가 날 길들인다면 내 생활은 햇빛을 받은 듯 환해질 거야","cover":"/assets/snippets/books/little-prince.png","review":"나이가 들면 가끔 다시 읽어본다. 읽을 때마다 새롭다. 경험이 쌓이고 책 읽을 당시의 기분과 분위기에 따라 내용이 조금씩 달라지는 것 같다. 번역한 출판사에 따라 내용도 조금씩 변하는 것 같다. 프랑스어를 못해서 원서는 불가능..","key":"e588a8e689c7f845723b0229f780056d"},{"file":"2023-11-13-screen-black-panther-wakanda-forever","type":"snippets","title":"블랙 팬서: 와칸다 포에버 (2022)","date":"2023-11-13","series":"screen","tags":["movie"],"description":"","cover":"/assets/snippets/screen/black-panther-wakanda-forever.png","review":"새로운 블랙 팬서의 등장은 기대에 미치지 못했고, 액션의 타격감마저 부족해 나약하게 느껴졌다. 전반적인 스토리는 예상 가능한 범주를 벗어나지 못했으며, 이를 상쇄할 만한 압도적인 영상미나 액션 시퀀스도 찾아보기 힘들었다. 무엇보다 그의 빈자리가 너무나 크게 다가와, 영화를 보는 내내 아쉬움과 슬픔이 짙게 남았다.","key":"7a5739f33a6edf44874c892e3683dfed"},{"file":"2023-11-15-books-flamingo-place","type":"snippets","title":"홍학의 자리","date":"2023-11-15","series":"books","tags":["mystery"],"description":"이 행복이 영원할 거라고 생각한 적은 없었다. 그러나 이런 끝을 상상한 적도 없었다.","cover":"/assets/snippets/books/flamingo-place.png","review":"강력 추천 도서! 절대 스포를 당하면 안 되는 책이긴 하지만 스포를 당했어도 재미있게 읽을 수 있었을 것 같다. 하지만 반전을 마주하며 받는 전율을 놓치긴 아깝다.","key":"68fb57fffac18908faee7f9fc7edfca2"},{"file":"2024-02-15-books-project-hail-mary","type":"snippets","title":"프로젝트 헤일메리","date":"2024-02-15","series":"books","tags":["SF"],"description":"이름도 기억 못하는 내가 인류의 희망이라니? 멸망 위기의 지구 구하기 프로젝트!","cover":"/assets/snippets/books/project-hail-mary.png","review":"너무 재미있게 읽었다. 이렇게 두꺼운 책을 이렇게 빨리 읽을 수 있구나 싶었다. 기억을 잃은 주인공과 아무것도 모르는 독자가 동일한 선상에서 시작되어 주인공과 함께 조금씩 사태를 파악하게 되는 구성이 흥미롭고 재미있었다. 모든 것을 과학적 사고로 생각하려는 너드스러움과 작가의 과학적 치밀함이 돋보이는 작품이 아닌가 생각된다.","key":"4420d86d4b88d866216b5f4f8416ed4b"},{"file":"2024-03-17-books-the-proof-of-goo","type":"snippets","title":"구의 증명","date":"2024-03-17","series":"books","tags":["novel"],"description":"여기 네가 있다. 나는 너와 있는데, 너는 나를 느끼지 못한다","cover":"/assets/snippets/books/the-proof-of-goo.png","review":"만약 네가 먼저 죽는다면 나는 너를 먹을 거야 책을 읽기 시작하면서 이 책의 장르를 의심했다. 도입부는 읽으며 이해가 안 됐었다. 하지만 뒷부분으로 갈수록 내용은 명확했다.","key":"985bdc1b66f877e7f59d2e862863a125"},{"file":"2024-04-03-books-the-vegetarian","type":"snippets","title":"채식주의자","date":"2024-04-03","series":"books","tags":["novel"],"description":"상처, 욕망, 그리고 죽음","cover":"/assets/snippets/books/the-vegetarian.png","review":"나에겐 다소 힘든 책이었다. 내용이 어렵다기보다는 작가의 표현과 단어 선택에서 한 인물의 힘든 감정이 잘 드러난다. 과거 정유정 작가님의 28을 봤을 때와 비슷한 힘듦을 느꼈다. 남편, 형부 그리고 언니의 시선으로 바라보는 영혜에게 느끼는 감정이 모두 다르다. 막상 주인공 영혜의 시점은 없다.","key":"0443b44f4e143c877e5e675da3e85cc9"},{"file":"2024-06-12-screen-inside-out-2","type":"snippets","title":"인사이드 아웃 2 (2024)","date":"2024-06-12","series":"screen","tags":["movie"],"description":"","cover":"/assets/snippets/screen/inside-out-2.png","review":"새로운 캐릭터들의 등장으로 사춘기의 감정을 잘 표현했다. 새로운 캐릭터들 또한 매력적이다. 우리는 소중한 기억을 먹으며 살아간다.","key":"2632a9e9930e68f202daabb11c880b7f"},{"file":"2024-06-18-books-seven-people-one-role","type":"snippets","title":"7인 1역","date":"2024-06-18","series":"books","tags":["mystery"],"description":"나는 일곱 번 살해되었다. 하나의 시체, 일곱 명의 범인 그리고 일곱 번의 수수께끼","cover":"/assets/snippets/books/seven-people-one-role.png","review":"책 제목에 끌려서 읽게 되었다. 렌죠 미키히코는 백광이라는 책을 통해 이미 알고 있었다. 사실 백광은 아주 재미있었다 정도는 아니어서 작가에 대한 큰 기대는 하지 않고 읽었다.","key":"923afa05c57fe85523d5ef4c712e73c9"},{"file":"2024-07-19-books-third-person-observer-perspective","type":"snippets","title":"3인칭 관찰자 시점","date":"2024-07-19","series":"books","tags":["thriller"],"description":"가톨릭 사제가 된 연쇄살인범의 아들 그는 아버지를 닮은 괴물인가, 편견의 희생자인가?","cover":"/assets/snippets/books/third-person-observer-perspective.png","review":"SNS에서 광고로 떠서 보게 되었다. 2018년 제14회 세계문학상 우수상을 받았다고 해서 읽어봐야겠다 했다. 인물과 사건을 여러 등장인물의 관찰자 시점으로 이야기를 풀어나가는 것이 흥미로웠다.","key":"5305b5150318cd4f4a5cc38f8158055b"},{"file":"2024-10-02-screen-love-in-the-big-city","type":"snippets","title":"대도시의 사랑법 (2024)","date":"2024-10-02","series":"screen","tags":["movie"],"description":"","cover":"/assets/snippets/screen/love-in-the-big-city.png","review":"전혀 내용을 모르고 봤다가 조금 당황했다. 심지어 포스터를 살짝 보고 남자 배우가 이재훈인줄 알고 봤다. 기대 안했지만 의외로 볼만했다.","key":"727ec75ddabb11aab863c89feacbc534"},{"file":"2024-10-03-screen-the-wild-robot","type":"snippets","title":"와일드 로봇 (2024)","date":"2024-10-03","series":"screen","tags":["movie"],"description":"","cover":"/assets/snippets/screen/the-wild-robot.png","review":"아기 기러기의 보호자가 된 로봇 이야기. 애니메이션 다운 충실한 스토리와 감동이 있었다. 인간의 탐욕으로 만들어진 로봇이 탐욕스럽지 않을 수 있을까?","key":"0b4c9e76ac516211550a7b96fd58ff5d"},{"file":"2024-10-13-books-open_darkness","type":"snippets","title":"열린 어둠","date":"2024-10-13","series":"books","tags":["mystery"],"description":"가질 수 없으면 부서뜨리고, 믿을 수 없으면 속여넘기고, 살릴 수 없다면 죽여버리는, 뜨거운 정념과 차가운 복수를 넘나드는 가식 없는 욕망으로의 초대","cover":"/assets/snippets/books/open_darkness.png","review":"렌조 미키히코의 7인 1역을 읽고 감명 받아 다른 작품도 읽어보자 해서 책을 읽기 시작했다. 사실 단편집인줄 모르고 등장하는 인물들에 대해 열심히 메모를 해가며 읽어 나갔다. 단편집인줄 깨닫고 다소 실망... 전형적인 일본 추리 소설의 동기와 트릭 찾기 였다.","key":"c5604df8b4f9cdbf8100086bb02b86fb"},{"file":"2024-12-14-books-death-1","type":"snippets","title":"죽음 1","date":"2024-12-14","series":"books","tags":["SF"],"description":"내 이름은 가브리엘 웰즈. 직업은 추리 작가이고, 죽은지 얼마 안된 \u003c신참\u003e 영혼이다","cover":"/assets/snippets/books/death-1.png","review":"이 책을 한마디로 표현하자면 누가 날 죽였지? 이다. 처음에는 자신이 죽었는지조차 깨닫지 못하였고, 자신의 죽음을 깨닫은 후에는 누군가 자신을 의도적으로 죽였다고 생각하여 그 범인을 찾기 시작한다. 이 책의 신선한 부분은 살인범을 피해자가 직접 추리한다는 것이다.","key":"afa4b15d50cbeef6321864c51a11c56b"},{"file":"2025-01-12-books-death-2","type":"snippets","title":"죽음 2","date":"2025-01-12","series":"books","tags":["SF"],"description":"자, 그럼 누가 나를 죽였을까? 의심스러운 사람들이 몇몇 떠오른다","cover":"/assets/snippets/books/death-2.png","review":"뒤로 갈수록 내용이 이상해진다. 소재부터 책의 초반 내용까지는 좋았으나 내용이 점점 산으로 간다. 고전 추리 소설가나 과거 위인들이 가끔씩 나와 자신들의 과거 영광에 대해 이야기하는 부분들은 웃음을 짓게 만든다.","key":"0401542560649c7967daf71f36853272"},{"file":"2025-02-30-books-three-body-1","type":"snippets","title":"삼체 1: 삼체문제","date":"2025-02-30","series":"books","tags":["SF"],"description":"인류가 이 전쟁에서 승리하는 것은 불가능하다. 너희는 벌레다!","cover":"/assets/snippets/books/three-body-1.png","review":"정말 재미있게 읽었다. 책 읽는 속도가 빠른 편은 아닌데, 이 책은 두꺼움에도 불구하고 금방 읽었다. 책 초반에 우리가 지금까지 알고 있던 기초 물리학의 붕괴와 그로 인한 과학자들의 자살.","key":"0514a0acb8dca6c20efd97720ebd421a"},{"file":"2025-04-05-screen-heroes_on_call","type":"snippets","title":"중증외상센터 Season 1 (2025)","date":"2025-04-05","series":"screen","tags":["tv"],"description":"","cover":"/assets/snippets/screen/heroes_on_call.png","review":"웹툰 원작답게 막나가는 능력자 캐릭터의 사이다 전개가 마음에 들었다. 가볍게 보기 좋은 드라마.","key":"a9b760c758ad64704d2ede7a2a1d7506"},{"file":"2025-04-10-books-three-body-2","type":"snippets","title":"삼체 2: 암흑의 숲","date":"2025-04-10","series":"books","tags":["SF"],"description":"암흑의 숲","cover":"/assets/snippets/books/three-body-2.png","review":"1편을 읽고 바로 읽기 시작한 2편. 이번은 1편보다 더욱 두껍다. 내가 읽었던 소설 책 중에 가장 두꺼웠을 수도.. 인류가 처한 위기를 극복하기 위해 전 세계가 고민을 한다.","key":"673c268379397829075e144ef68a5383"},{"file":"2025-06-01-location-restaurant-BrewerkzRiversidePoint","type":"snippets","title":"Brewerkz Riverside Point","date":"2025-06-01","series":"location","tags":["restaurant"],"description":"","cover":"/assets/snippets/location/d636e3ff2c6ee1140a4c17ce4ef36c74.jpg","review":"좋은 뷰와 함께 맥주를 먹을 수 있는 곳이다. 사진에는 없지만 피자와 맥주를 맛있게 먹을 수 있었다. 치킨이 먹고 싶어서 시킨 닭은 좀 아쉬웠다.","key":"318fac8ce0643fea745d7d63cd6675b9"},{"file":"2025-06-02-location-cafe-TiongBahrubakery","type":"snippets","title":"티옹바루 베이커리","date":"2025-06-02","series":"location","tags":["cafe"],"description":"","cover":"/assets/snippets/location/0f64841363efcf2ca178d701372de450.jpg","review":"공항 가기 전에 시간이 남아서 들렀던 카페이다. 한창 더워서 시원한 커피가 필요했던 타이밍에 오아시스 같은 카페였다. 빵도 커피도 맛있었다.","key":"7ec5374b045ddd2fe8dbabbf3f66fb3a"},{"file":"2025-06-08-screen-how-to-train-your-dragon","type":"snippets","title":"드래곤 길들이기 (2025)","date":"2025-06-08","series":"screen","tags":["movie"],"description":"","cover":"/assets/snippets/screen/how-to-train-your-dragon.png","review":"원작의 스토리를 무리하게 각색하지 않고 충실하게 실사화한 점이 가장 마음에 들었다. 원작의 감동을 다시 한번 느끼고 싶은 팬들에게 추천하고 싶은 영화다. 투스리스는 귀엽다.","key":"e267f36fd77fad4f55962499af908ef9"},{"file":"2025-06-20-location-cafe-arirang-dowon","type":"snippets","title":"아리랑도원","date":"2025-06-20","series":"location","tags":["cafe"],"description":"","cover":"/assets/snippets/location/ec1d9222e8fb7d5d801d1d4a2f557082.jpg","review":"인테리어 컨셉이 심상치 않은 인테리어 카페이다. 하지만 컨셉에 비해 디테일이 조금 아쉽다. 이왕 컨셉으로 인테리어 한 거 더욱 과하게 해도 나쁘지 않았을 것 같다.","key":"5ba9f9fce2aa405abd5adbd6c730e141"},{"file":"2025-06-21-location-restaurant-ChinaPanda24HourMainBranch","type":"snippets","title":"차이나팬더 24시 본점","date":"2025-06-21","series":"location","tags":["restaurant"],"description":"","cover":"/assets/snippets/location/391067088de5b603d6c0e92e4507e3d5.jpg","review":"음식이 깔끔하고 안정적이다. 생각보다 간이 과하지 않아서 좋았다. 탕수육 누린내도 없고 튀김옷도 과하지 않아서 좋다.","key":"3f88217692a6cf3ca2c8e1a642e44b4f"},{"file":"2025-06-21-screen-elio","type":"snippets","title":"엘리오 (2025)","date":"2025-06-21","series":"screen","tags":["movie"],"description":"","cover":"/assets/snippets/screen/elio.png","review":"화려한 영상미는 확실히 눈을 사로잡기에 충분하다. 하지만 소재에 비해 감동의 깊이가 얕아 더 감동적일 수 있었을 텐데 하는 아쉬움이 남는다. 캐릭터들의 개성 또한 다소 약하여 깊은 인상을 남기지 못했다.","key":"f37e1102ac333fc25fe771405a33a57c"},{"file":"2025-07-02-books-sapiens","type":"snippets","title":"사피엔스","date":"2025-07-02","series":"books","tags":["anthropology"],"description":"인간이 신을 발명할 때 역사는 시작되었고, 인간이 신이 될 때 역사는 끝날 것이다.","cover":"/assets/snippets/books/sapiens.png","review":"마음에 숙제로 남아 있던 책을 드디어 완독하게 되었다. 조금 많이 두껍다. 하지만 생각보다 읽는데 오래 걸리진 않았다. 인지 혁명 부터 농업 혁명 까지는 아주 재미있게 읽었다.","key":"999d857f8eb50ceb72c52f16026def8c"},{"file":"2025-07-05-location-restaurant-ManjaeneDongtanBranch","type":"snippets","title":"만재네 동탄점","date":"2025-07-05","series":"location","tags":["restaurant"],"description":"","cover":"/assets/snippets/location/e7ba70c22eba90616469e57b1dfe99f3.jpg","review":"갑자기 고기가 먹고 싶어서 근처 서성거리다 들어간 곳이다. 기대 안 했었는데, 생각보다 맛있어서 많이 먹어버렸다. 기회가 되면 다시 가보면 좋을 것 같다.","key":"1892375a36b1106fd13e47b258cde13a"},{"file":"2025-07-05-screen-Jurassic-world-rebirth","type":"snippets","title":"쥬라기 월드: 새로운 시작 (2025)","date":"2025-07-05","series":"screen","tags":["movie"],"description":"","cover":"/assets/snippets/screen/Jurassic-world-rebirth.png","review":"예상 가능한 뻔한 스토리와 평이한 영상미는 기대에 미치지 못했다. 수많은 희생이 있었음에도 불구하고 억지스러운 해피엔딩으로 포장하려는 결말이 특히 아쉽다.","key":"feaa91b8e0a6cc13fbd47248a4456504"},{"file":"2025-07-16-books-three-body-3","type":"snippets","title":"삼체 3: 사신의 영생","date":"2025-07-16","series":"books","tags":["SF"],"description":"뇌만 보냅시다","cover":"/assets/snippets/books/three-body-3.png","review":"삼체 3에서는 작가의 상상력과 과학 지식을 동원해 우주의 본질이 무엇인지를 보여주었다. 물론 하드 SF 요소다. 이 시리즈는 차원 이야기가 많이 나온다. 작품 초반에는 상상하며 읽었지만, 이후에는 상상하기를 포기했다.","key":"7435344e0e27d33cbd0689a35013cd2c"},{"file":"2025-07-18-location-restaurant-HouwseomLotteDepartmentStoreDongtanBranch","type":"snippets","title":"호우섬 롯데백화점 동탄점","date":"2025-07-18","series":"location","tags":["restaurant"],"description":"","cover":"/assets/snippets/location/b1aae6fbe253a8fe986970e18b720936.jpg","review":"딤섬이 먹고 싶을 때 자주 가는 곳. 갈 때마다 꿔바육은 꼭 시킨다. 딤섬을 많이 먹고 싶은데, 가격이 있어서 다소 부담스럽다.","key":"b0905039f3363f05d6a9c78dc5b39c8e"},{"file":"2025-07-22-screen-daily-dose-of-sunshine","type":"snippets","title":"정신병동에도 아침이 와요 시즌 1 (2023)","date":"2025-07-22","series":"screen","tags":["tv"],"description":"","cover":"/assets/snippets/screen/daily-dose-of-sunshine.png","review":"제목만 보고 가벼운 힐링물이라 생각했지만, 결코 가볍지 않은 무게감을 지닌 작품이다. 정신 질환에 대한 편견을 걷어내고 우리 자신을 돌아보게 만들며, 많은 생각할 거리를 남긴다. 암보르시아","key":"f941263a2b55586aba984ce45a21ec4b"},{"file":"2025-07-24-location-cafe-HadoMunSokcho","type":"snippets","title":"하도문속초","date":"2025-07-24","series":"location","tags":["cafe"],"description":"","cover":"/assets/snippets/location/3823366ceb5010555f4f867f8f68e479.jpg","review":"분위기도 좋고 뷰도 좋다. 평일 낮 시간이라 다행히 자리가 있었지만 주말에는 사람이 많아 자리가 없다고 한다. 인테리어도 깔끔하고 감성 있게 꾸며져 있다.","key":"be49004a7e31f38315663427177a631f"},{"file":"2025-07-24-location-restaurant-JangsangnimakguksuYangyangMainBranch","type":"snippets","title":"장산리막국수 양양본점","date":"2025-07-24","series":"location","tags":["restaurant"],"description":"","cover":"/assets/snippets/location/9c9e0a4152315f87af85d2e03d7b4329.jpg","review":"주문하면 면을 뽑는 자가제면이라 시간이 좀 걸리지만 전혀 문제가 안 된다. 맛있게 먹는 법이 있어서 그대로 따라 했다. 비빔은 따로 없고, 비빔을 먹다가 따로 주신 살얼음 동치미 육수를 넣어 물막국수로 먹으면 된다.","key":"047a4460937aba652f3bc495ed9bc23d"},{"file":"2025-07-25-location-restaurant-88GrilledFish","type":"snippets","title":"88생선구이","date":"2025-07-25","series":"location","tags":["restaurant"],"description":"","cover":"/assets/snippets/location/06c065c1486d4bfa093cdc93ac7013cf.jpg","review":"입장하자마자 인원을 물어보고 숯불과 함께 바로 세팅이 된다. 손질된 생선을 바로 구워주신다. 숯불에 직접 구운 생선구이는 역시 진리!","key":"302a21910de8f1ea83f2d3f1312b1a09"},{"file":"2025-07-25-location-restaurant-ChongchosuMulhoeSokchoMainBranch","type":"snippets","title":"청초수물회 속초본점","date":"2025-07-25","series":"location","tags":["restaurant"],"description":"","cover":"/assets/snippets/location/de8d8a6be705ab1d9066ca4fb650f947.jpg","review":"손님이 많아 웨이팅이 있지만, 음식이 워낙 빠르게 나오고 매장 규모가 커서 회전율이 좋다. 경치 좋은 곳을 원한다면 조금 더 기다려야 한다. 우리는 성공! 가격이 저렴한 편은 아니지만 워낙 재료들이 신선하기 때문에 가격은 인정.","key":"c3cd5482c28fee230e4254f3743330de"},{"file":"2025-07-26-location-restaurant-IchonShelter","type":"snippets","title":"이촌쉼터","date":"2025-07-26","series":"location","tags":["restaurant"],"description":"","cover":"/assets/snippets/location/809c9337ec22407490f9b71f3680d51a.jpg","review":"국물 간이 세지 않아 깔끔하고 담백하다. 칼국수가 쫄깃한 옹심이와 잘 어울린다. 당시 체한 상태여서 많이 먹지 못해서 아쉽다.","key":"9f715caa5be709b5e75ae859f1d5569f"},{"file":"2025-07-30-books-the-source-of-happiness","type":"snippets","title":"행복의 기원","date":"2025-07-30","series":"books","tags":["humanities"],"description":"행복은 삶의 목적이 아니다. 생존과 번식을 위한 도구일 뿐","cover":"/assets/snippets/books/the-source-of-happiness.png","review":"인간은 행복하기 위해 사는 게 아니라, 생존하기 위해 행복을  느끼도록 설계되었을 뿐이다. 행복은 목적이 아닌 생존 도구이다.","key":"69b3eacb92b8ad3383320d65bbea4eae"},{"file":"2025-08-02-location-cafe-Bohrhour","type":"snippets","title":"뵈르아워","date":"2025-08-02","series":"location","tags":["cafe"],"description":"","cover":"/assets/snippets/location/ea441e9e162d29ca31d72f8ed8c19e3d.jpg","review":"예상치 못한 곳에 위치해 있었다. 빵, 음료 모두 맛있었고, 오늘의 수프도 있어서 든든하게 먹을 수 있었다. 따뜻하고 아늑한 분위기가 좋았다.","key":"304eb7d8af7ba51c84bf8c9e7495c978"},{"file":"2025-08-02-location-restaurant-MachandeulKingsaltGrilledMeatDongtanBranch","type":"snippets","title":"맛찬들왕소금구이 동탄점","date":"2025-08-02","series":"location","tags":["restaurant"],"description":"","cover":"/assets/snippets/location/e30c3d8d2bb56a20300ce271d7236f80.jpg","review":"추억의 맛찬들을 아주 오랜만에 방문했다. 이것저것 같이 싸 먹을 수 있는 것들이 많아서 좋다. 역시나 맛있는 맛찬들.","key":"d8eefb3ba8b2b9a73ecc854bb8fb9cb0"},{"file":"2025-08-04-books-the-strange-house","type":"snippets","title":"이상한 집","date":"2025-08-04","series":"books","tags":["mystery"],"description":"부동산 미스터리?","cover":"/assets/snippets/books/the-strange-house.png","review":"개인 유튜브에 공개된 부동산 미스터리 - 이상한 집이라는 제목의 영상이 인기를 끌어 책으로 나왔다고 한다. 평범해 보이는 주택 평면도에 숨겨진 기묘한 위화감을 대화 형식으로 추리해 나가는 구성이다. 평범해 보이는 주택 도면에서 어떤 문과도 연결되지 않은 채 완전히 고립된 의문의 공간이 존재한다.","key":"40b89643380428f52ae6ced95da0dc96"},{"file":"2025-08-08-location-cafe-Bubing","type":"snippets","title":"부빙","date":"2025-08-08","series":"location","tags":["cafe"],"description":"","cover":"/assets/snippets/location/272246c28e6ec8d077280ad8c42a1b09.jpg","review":"가장 기본적인 팥빙수는 우유 빙수이며, 많이 달지 않았다. 다른 과일 빙수는 먹어보지 못했지만 개인적으로 넘사벽 빙수를 알고 있기 때문에 성에 차진 않았다.","key":"2da10f8cc78698344f188999b93471f1"},{"file":"2025-08-08-location-cafe-PoinhandGyeonguiForestBranch","type":"snippets","title":"포인핸드 경의숲점","date":"2025-08-08","series":"location","tags":["cafe"],"description":"","cover":"/assets/snippets/location/47de52751e900c3a324142452bca9816.jpg","review":"유기견과 함께할 수 있는 카페. 유기견을 입양할 수도 있고 기부할 수도 있는 좋은 카페이다. 산책 봉사도 가능하다.","key":"8b5edea3080f3aa9a41460ae7844b2b6"},{"file":"2025-08-08-location-restaurant-JadeNoodleHouse","type":"snippets","title":"옥면가","date":"2025-08-08","series":"location","tags":["restaurant"],"description":"","cover":"/assets/snippets/location/f848a824b618d0da0125e2dcffeeecd6.jpg","review":"매장이 좁고 근처 회사에서 많이 방문해서 그런지 웨이팅이 있다. 통장각도 있어 푸짐하다. 주변을 보면 얼큰 우사골 옥면도 많이 시키셨었다.","key":"3db6e218e544cc1f83baf5b8f8abc4b7"},{"file":"2025-08-17-screen-what_dreams_may_come","type":"snippets","title":"천국보다 아름다운 시즌 1 (2025)","date":"2025-08-17","seri hriller"],"description":"악마가 필요하다. 부패한 자들을 소멸하기 위해","cover":"/assets/snippets/books/Thunderhead.png","review":"전작 수확자(Scythe)가 구축한 세계관을 비극적으로 확장하며, 그 세계가 품고 있던 철학적 질문의 깊이를 파고든다. 인류가 죽음을 정복한 후 인구 조절을 위해 만들어진 수확자 시스템이 필연적으로 실패할 수밖에 없는 과정을 보여주는 것 같다. 기술적으로 완벽한 유토피아라고 해도, 전지전능한 AI가 의도적으로 통제하지 않는 상황이라면 인간의 어쩔 수 없는 야망과 잔인함, 그리고 권력욕에 의해 붕괴되는 것은 필연적이다.","key":"1dad96f0b9464ac7a58e1ae9c5b99860"},{"file":"2025-10-03-screen-Demon_Slayer_Kimetsu_no_Yaiba_Infinity_Castle_Arc","type":"snippets","title":"극장판 귀멸의 칼날: 무한성편 (2025)","date":"2025-10-03","series":"screen","tags":["movie"],"description":"","cover":"/assets/snippets/screen/Demon_Slayer_Kimetsu_no_Yaiba_Infinity_Castle_Arc.png","review":"극장판답게 압도적인 영상미와 화려한 액션을 볼 수 있다. 악역인 혈귀들에게도 각자의 사연을 부여하여 입체적인 캐릭터를 완성했다.","key":"f557fa59b4c4f88c99f1c5022f93a234"},{"file":"2025-10-08-location-cafe-HouseHeil","type":"snippets","title":"하우스 하일","date":"2025-10-08","series":"location","tags":["cafe"],"description":"","cover":"/assets/snippets/location/5e8fc563633a69b4413659f7d0bd3177.jpg","review":"여유롭게 코바늘을 즐길 수 있었다. 강아지 출입이 가능하다. 어느 손님의 귀여운 강아지를 볼 수 있었다!","key":"169f663b026d7acece48e06f93d0d08a"},{"file":"2025-11-11-stash-unpack_the_images_from_super.img","type":"snippets","title":"Unpack the images from super.img","date":"2025-11-11","series":"stash","tags":["AOSP"],"description":"","cover":"","review":"","key":"54417b7f0cae2196c6d7864285e1ac6e"},{"file":"2025-11-13-location-restaurant-JingisHwaseongDongtanBranch","type":"snippets","title":"징기스 화성동탄점","date":"2025-11-13","series":"location","tags":["restaurant"],"description":"","cover":"/assets/snippets/location/7580941c71cb6d0269b56af1240c5c4c.jpg","review":"양고기 냄새도 안 나고, 잘 구워주신다. 양고기 모둠 Set B를 주문했는데, 양고기 감자탕도 포함되어 있었다. 양 감자탕을 처음 먹었는데, 특별한 이질감 없이 만족스럽게 먹었다.","key":"0ace859f8f200563ec7ffa27622bfaa1"},{"file":"2025-11-14-books-the-toll","type":"snippets","title":"종소리 The Toll","date":"2025-11-14","series":"books","tags":["thriller"],"description":"유토피아의 파멸을 알리는 종이 울린다","cover":"/assets/
