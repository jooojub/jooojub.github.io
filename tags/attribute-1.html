ed/2026-02-05-post-rpi-zero2-enabling-eink-display-on-raspberry-pi-zero-2w-with-yocto.png","review":"라즈베리 파이 제로 2W와 요크토 환경에서 GDEY075T7-T01 E-Ink 디스플레이를 활성화하기 위한 하드웨어 구성 방법과 필수 파이썬 패키지 설치를 위한 이미지 레시피 수정 과정을 설명합니다.","key":"0e76645860ab2b3784e22cf4163cdac9"},{"file":"2026-02-19-post-bash_RANDOM_variable","type":"posts","title":"Bash $RANDOM Variable","date":"2026-02-19","series":"linux","tags":["bash"],"description":"Understanding and using the $RANDOM internal variable in Bash, including its open-source implementation","cover":"/assets/posts/linux/post-bash_RANDOM_variable.jpg","review":"Bash의 $RANDOM 내장 변수를 활용해 0에서 32767 사이의 난수를 생성하는 방법부터 범위 지정 및 시드 설정법, 그리고 오픈 소스 코드를 통해 분석한 내부 동작 원리까지 상세히 설명합니다.","key":"0bdfcc0a20c464ea5d4d7218d74d45f5"},{"file":"2026-03-06-post-building-lineageos-14.1-for-samsung-galaxy-note-8.0","type":"posts","title":"Building LineageOS 14.1 for Samsung Galaxy Note 8.0 (n5110)","date":"2026-03-06","series":"aosp","tags":["android"],"description":"A guide to configuring a Docker build environment, syncing repositories, and compiling a custom ROM for the n5110","cover":"/assets/posts/aosp/building-lineageos-14.1-for-samsung-galaxy-note-8.0.png","review":"구형 삼성 갤럭시 노트 8.0(n5110) 태블릿을 활용하기 위해 리니지OS 14.1 커스텀 롬 빌드 환경을 구축하고 소스 코드를 내려받아 기기 전용 코드를 준비하는 과정을 단계별로 소개합니다.","key":"dfa809079eae95280382d06aacbbdee9"},{"file":"2026-03-09-post-gcc-attribute-constructor-destructor","type":"posts","title":"gcc attribute: constructor \u0026 destructor","date":"2026-03-09","series":"gcc","tags":["attribute"],"description":"Explore the internal process and usage of gcc attributes: constructor (pre-main execution) and destructor (post-main execution).","cover":"/assets/posts/gcc/gcc-attribute-constructor-destructor.png","review":"C 언어에서 GCC의 constructor 및 destructor attribute를 활용하여 main 함수 시작 전과 종료 후 자동으로 실행되는 함수를 정의하고 실행 순서를 제어하는 방법을 소개합니다.","key":"cebd0c2be4ba7b283a98ef213f93f42a"},{"file":"2026-03-10-post-flashing-lineageos-14.1-for-samsung-galaxy-note-8.0","type":"posts","title":"Flashing LineageOS 14.1 for Samsung Galaxy Note 8.0 (n5110)","date":"2026-03-10","series":"aosp","tags":["android"],"description":"A guide to flashing the compiled LineageOS 14.1 ROM and recovery image to the Samsung Galaxy Note 8.0 (n5110).","cover":"/assets/posts/aosp/building-lineageos-14.1-for-samsung-galaxy-note-8.0.png","review":"Samsung Galaxy Note 8.0(n5110) 기기에 직접 빌드한 LineageOS 14.1 커스텀 롬과 리커버리 이미지를 리눅스 환경에서 Heimdall 도구를 사용하여 플래싱하고 초기화하는 과정을 상세히 설명합니다.","key":"8fc5b1d2afa09201a8333d4a0b99cc05"},{"file":"2026-03-25-post-gcc-options-format","type":"posts","title":"gcc options: -Wformat","date":"2026-03-25","series":"gcc","tags":["gcc_options"],"description":"Explore the -Wformat option in GCC to detect format string errors and security vulnerabilities at compile time.","cover":"/assets/posts/gcc/gcc-options-format.png","review":"GCC의 -Wformat 옵션을 활용하여 printf, scanf 등 포맷 스트링 사용 시 발생할 수 있는 타입 불일치 및 보안 취약점을 컴파일 단계에서 찾아내는 방법을 상세히 알아봅니다.","key":"d6bced76119c26003f99d239c66cd9ed"},{"file":"2026-03-26-post-gcc-attribute-cleanup","type":"posts","title":"gcc attribute: cleanup","date":"2026-03-26","series":"gcc","tags":["attribute"],"description":"The cleanup attribute runs a function when a variable goes out of scope. This attribute can only be applied to auto function scope variables.","cover":"/assets/posts/gcc/gcc-attribute-cleanup.png","review":"GCC의 cleanup 속성을 활용하여 변수가 스코프를 벗어날 때 자동으로 실행되는 정리 함수를 정의하고, 자원 누수를 예방하여 안전한 코드를 작성하는 방법을 알아봅니다.","key":"576ae1e1c163db642cf4b359e8b86927"},{"file":"2026-03-28-post-gcc-null-not-equal-to-zero","type":"posts","title":"NULL != 0","date":"2026-03-28","series":"gcc","tags":["gnu"],"description":"Exploring why NULL and 0 are not equivalent in GNU C through pre-processor results and memory analysis.","cover":"/assets/posts/gcc/post-gcc-null-not-equal-to-zero.png","review":"GNU C 환경에서 NULL과 0의 차이점을 분석하고, 가변 인자 함수 등에서 발생할 수 있는 잠재적인 위험성을 상세히 설명합니다. 특히 64비트 환경에서의 크기 차이와 가변 인자 함수에서의 주의점을 다룹니다.","key":"5356f3f7cc5a61f10c34b7b44717bfb9"},{"file":"2026-04-01-post-gcc-attribute-nonnull","type":"posts","title":"gcc attribute: nonnull","date":"2026-04-01","series":"gcc","tags":["attribute"],"description":"The nonnull attribute specifies that some function parameters should be non-null pointers. This allows the compiler to check at compile-time if a null pointer is passed to these arguments.","cover":"/assets/posts/gcc/gcc-attribute-nonnull.png","review":"GCC의 nonnull 속성을 사용하여 함수 인자로 NULL이 전달되는 것을 컴파일 타임에 감지하고 예방하는 방법을 알아봅니다. 속성의 사용법, 한계점 및 -Wnonnull 옵션과의 연동 방법을 상세히 다룹니다.","key":"75200cd2ed371dfeab98fbbaa6113289"},{"file":"2026-04-02-post-gcc-options-fsigned-char","type":"posts","title":"gcc options: -fsigned-char","date":"2026-04-02","series":"gcc","tags":["gcc_options"],"description":"A guide to understanding and using the -fsigned-char and -funsigned-char GCC options to control the signedness of plain char.","cover":"/assets/posts/gcc/post-gcc-options-fsigned-char.png","review":"GCC의 -fsigned-char와 -funsigned-char 옵션에 대해 알아봅니다. 아키텍처나 컴파일러 설정에 따라 달라지는 plain char의 기본 부호(signed/unsigned) 특성을 제어하는 방법과 코드 이식성을 위한 권장 사항을 설명합니다.","key":"63fd0d0ca2a9b389f1a6ddfcba7d6fc0"},{"file":"2026-04-06-post-gcc-builtin-alloca","type":"posts","title":"gcc builtin: alloca","date":"2026-04-06","series":"gcc","tags":["gcc_builtin"],"description":"The alloca() function allocates size bytes of space in the stack frame of the caller. This temporary space is automatically freed when the function that called alloca() returns to its caller.","cover":"/assets/posts/gcc/post-gcc-builtin-alloca.png","review":"GCC 내장 함수인 __builtin_alloca의 동작 원리와 사용법을 상세히 알아봅니다. 힙이 아닌 스택에 메모리를 할당하는 방식의 장단점과 보안상 주의사항, 그리고 VLA와의 차이점을 코드를 통해 설명합니다.","key":"00169c5d1a5994c4ed81e435c65c242c"},{"file":"2026-04-07-post-gcc-builtin-choose-expr","type":"posts","title":"gcc builtin: choose_expr","date":"2026-04-07","series":"gcc","tags":["gcc_builtin"],"description":"You can use the built-in function __builtin_choose_expr to evaluate code depending on the value of a constant expression. This built-in function returns exp1 if const_exp, which is an integer constant expression, is nonzero. Otherwise it returns exp2.","cover":"/assets/posts/gcc/post-gcc-builtin-choose-expr.png","review":"GCC 내장 함수인 __builtin_choose_expr의 동작 원리와 사용법을 상세히 알아봅니다. 컴파일 타임에 조건에 따라 표현식을 선택하는 방법과 실제 활용 사례를 통해 설명합니다.","key":"bc5f4167727675ede1d5a0acca3152cb"},{"file":"2026-04-08-post-gcc-attribute-format","type":"posts","title":"gcc attribute: format, format_arg","date":"2026-04-08","series":"gcc","tags":["attribute"],"description":"The format attribute specifies that a function takes printf, scanf, strftime or strfmon style arguments which should be type-checked against a format string.","cover":"/assets/posts/gcc/post-gcc-attribute-format.png","review":"GCC의 format 및 format_arg 속성을 사용하여 사용자 정의 함수에서도 printf나 scanf와 같은 타입 체크 기능을 활성화하는 방법을 상세히 알아봅니다. 실무 활용 사례와 내부 동작 원리를 통해 안전한 C 코드를 작성하는 가이드를 제공합니다.","key":"d2b756abeab0cac91a0c9d7ccc83ec0a"},{"file":"2026-06-08-post-ai-agents-for-beginners-01-intro","type":"posts","title":"AI Agents for Beginners - 1. Intro to AI Agents and Agent Use Cases","date":"2026-06-08","series":"ai","tags":["ai-agents"],"description":"A breakdown of AI Agent core components (Environment, Sensors, LLM, Tools, Memory), 7 agent types, when to use agents, and a hands-on Python example with Azure AI Foundry.","cover":"/assets/posts/ai/ai-agents-for-beginners-01-intro.png","review":"LLM이 단순 텍스트 생성을 넘어 실제 행동을 할 수 있도록 만드는 AI Agent의 구조를 Environment·Sensors·Actuators·Memory·Tools 관점에서 설명합니다. Simple Reflex, Model-Based, Goal-Based, Utility-Based, Learning, Hierarchical, Multi-Agent 7가지 유형을 여행 에이전트 예시로 비교하고, Azure AI Foundry와 Python으로 첫 번째 AI Agent를 직접 구현하는 과정을 소개합니다.","key":"5e4fd9686c1af6974c89cc1a03dab7a3","order":1},{"file":"2026-06-08-post-ai-agents-for-beginners-02-explore-agentic-frameworks","type":"posts","title":"AI Agents for Beginners - 2. Explore Agentic Frameworks","date":"2026-06-08","series":"ai","tags":["ai-agents"],"description":"A comparison of Microsoft Agent Framework and Azure AI Agent Service — modular components, multi-agent collaboration, and when to use each for building production AI agents.","cover":"/assets/posts/ai/ai-agents-for-beginners-02-explore-agentic-frameworks.png","review":"AI Agent Framework가 기존 AI와 어떻게 다른지, Microsoft Agent Framework(MAF)와 Azure AI Agent Service의 차이점을 비교합니다. Modular Components, 멀티에이전트 협력, Real-Time Learning으로 빠르게 prototype하는 방법과 각 플랫폼의 적합한 사용 시나리오를 Python 코드 예시와 함께 정리합니다.","key":"22c18bc940848c86d7458da01357e4f9","order":2},{"file":"2026-06-08-post-ai-agents-for-beginners-03-agentic-design-patterns","type":"posts","title":"AI Agents for Beginners - 3. Agentic Design Patterns","date":"2026-06-08","series":"ai","tags":["ai-agents"],"description":"A guide to Agentic Design Principles (Space, Time, Core) and three practical patterns — Clear Instructions, Structured Output, and Single Responsibility — for building effective AI agents.","cover":"/assets/posts/ai/ai-agents-for-beginners-03-agentic-design-patterns.png","review":"AI Agent를 설계할 때 따라야 할 Agentic Design Principles (Space·Time·Core)와 세 가지 구현 패턴(Clear Instructions, Structured Output, Single Responsibility)을 Travel Agent 예제 코드와 함께 소개합니다.","key":"656dcec7890f6fa81f05eb581d4ee673","order":3},{"file":"2026-06-08-post-ai-agents-for-beginners-04-tool-use","type":"posts","title":"AI Agents for Beginners - 4. Tool Use Design Pattern","date":"2026-06-08","series":"ai","tags":["ai-agents"],"description":"How AI agents use tools via function calling — building blocks, tool schemas, approval modes, and practical examples with Microsoft Agent Framework and Azure AI Agent Service.","cover":"/assets/posts/ai/ai-agents-for-beginners-04-tool-use.png","review":"AI Agent의 Tool Use Design Pattern을 깊이 있게 다룹니다. Function/Tool Calling의 동작 원리, 빌딩 블록(Schema·Execution·State), @tool 데코레이터 활용, approval_mode로 인간 감독 유지, Azure AI Agent Service의 Knowledge/Action Tool 구성까지 Python 예제와 함께 정리합니다.","key":"a321a1617b7e85123581832d7a591c2a","order":4},{"file":"2026-06-08-post-ai-agents-for-beginners-05-agentic-rag","type":"posts","title":"AI Agents for Beginners - 5. Agentic RAG","date":"2026-06-08","series":"ai","tags":["ai-agents"],"description":"Agentic RAG — how LLMs autonomously decide when and how to retrieve information, iterate with a maker-checker loop, self-correct, and deliver high-quality grounded responses.","cover":"/assets/posts/ai/ai-agents-for-beginners-05-agentic-rag.png","review":"Agentic RAG의 핵심 개념을 정리합니다. 전통적 RAG와의 차이, 반복적 Maker-Checker 루프, Tool 통합과 Memory, 자기 수정 메커니즘, 실용 사례, Governance까지 Python 코드 예제와 함께 소개합니다.","key":"d954e5c9291a92a1e7e021794fb3b747","order":5},{"file":"2026-06-09-post-ai-agents-for-beginners-06-building-trustworthy-agents","type":"posts","title":"AI Agents for Beginners - 6. Building Trustworthy AI Agents","date":"2026-06-09","series":"ai","tags":["ai-agents"],"description":"How to build safe and trustworthy AI agents — system message framework, threat mitigation, and human-in-the-loop patterns for secure, reliable agentic systems.","cover":"/assets/posts/ai/ai-agents-for-beginners-06-building-trustworthy-agents.png","review":"신뢰할 수 있는 AI Agent를 구축하는 방법을 다룹니다. Meta System Message Framework로 안전한 프롬프트를 설계하고, Prompt Injection·Knowledge Base Poisoning 등 5가지 위협을 완화하며, Human-in-the-Loop 패턴으로 사용자 감독을 유지하는 방법을 Python 코드 예제와 함께 정리합니다.","key":"05e2f868ab5df3e9d14c6a4c30c78fe4","order":6}],"title":"# attribute"},"__N_SSG":true},"page":"/tags/[TagList]","query":{"TagList":"attribute-1"},"buildId":"vaZMqketvJuFELjI1xhST","isFallback":false,"gsp":true,"scriptLoader":[]}</script></body></html>
