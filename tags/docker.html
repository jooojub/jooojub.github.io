89140685db367"},{"file":"2026-03-21-location-cafe-Mooninthewaterflowerinthemirror","type":"snippets","title":"수월경화","date":"2026-03-21","series":"location","tags":["cafe"],"description":"","cover":"/assets/snippets/location/7eb23f0631873ded35bf2fb3e99f182d.jpg","review":"해변관광열차를 타고 이동해서 방문한 곳이다. 크게 기대하고 찾아간 곳은 아니었지만, 생각보다 뷰가 참 좋은 곳이었다. 들어가는 입구에는 카페의 정체성을 보여주는 장식이 되어 있었다.","key":"ecc5fe5b527a2c5296518739c39ba17f"},{"file":"2026-03-21-location-cafe-TigerGelatoRiceCakeBusanHaeundaeMainStore","type":"snippets","title":"호랑이젤라떡 부산해운대본점","date":"2026-03-21","series":"location","tags":["cafe"],"description":"","cover":"/assets/snippets/location/f40bb6523dd60e0f84b3c3cc4e6ba5d3.jpg","review":"일부러 찾아가려고 한 건 아닌데, 해변관광열차 탑승 시간이 남아 근처를 돌아다니던 중에 매장 오픈 시간이 얼마 남지 않았고, 마침 기다리는 사람도 많지 않아서 바로 오픈런 줄을 섰다. 오픈을 기다리며 어떤 맛을 살까 메뉴를 찾아보며 고민을 했다. 포장 전문 매장인데, 어떤 시스템인지 몰라 찾아보니 기본 4구부터 구매 가능하다고 한다.","key":"768611a726b8bc7fdc1e648e41ac9df4"},{"file":"2026-03-21-location-restaurant-SongheonHouse","type":"snippets","title":"송헌집","date":"2026-03-21","series":"location","tags":["restaurant"],"description":"","cover":"/assets/snippets/location/0ae7822b06b3d451a5e277a0a1d61d8b.jpg","review":"미쉐린 가이드 부산에 소개된 곳이라고 한다. 웨이팅이 많을 것 같아 기대하지 않고 오픈 전에 방문해 보았는데, 주말 저녁임에도 운 좋게 대기가 많지 않아 현장에 있는 '캐치테이블'로 바로 예약을 걸었다. 오픈하고 얼마 지나지 않아 자리를 안내받을 수 있었다.","key":"dab595177716189e051185679bc0ee0f"},{"file":"2026-03-21-location-restaurant-SongjeongBeachMakguksuHaeundaeBranch","type":"snippets","title":"송정해변막국수 해운대점","date":"2026-03-21","series":"location","tags":["restaurant"],"description":"","cover":"/assets/snippets/location/98b0de32b3a671edb52eb620d242f99c.jpg","review":"고(故) 정주영 현대그룹 명예회장이 생전에 강원도를 방문할 때마다 헬기를 타고 찾아갈 정도로 무척 즐겨 드셨던 단골집으로 잘 알려진 곳이라고 한다. 물론 본점은 강원도에 있지만, 맛을 이어받은 분점이라 믿고 방문하였다. 물막국수는 슴슴한 맛이 특징이라고 한다.","key":"b3a15058d920a1a80551aa3b7ad7cd82"},{"file":"2026-03-21-location-spot-SillyCorp","type":"snippets","title":"주책공사","date":"2026-03-21","series":"location","tags":["spot"],"description":"","cover":"/assets/snippets/location/b8f87dd641bc4ab23838b4b7247dec56.jpg","review":"부산 수영구 민락동에 자리한 매력적인 독립서점, '주책공사'를 방문했다. 이곳의 가장 큰 특징은 바로 생일 책 패키지가 있다는 점이다. 책의 초판 출간일을 기준으로, 나 혹은 선물 받는 사람의 생일(월, 일)과 똑같은 날짜에 세상에 나온 책을 큐레이션해 블라인드 북 형태로 예쁘게 포장해 준다.","key":"1ab60c9bf10eb49496bf6774b6cdecb6"},{"file":"2026-03-24-stash-fixing-adb-remount-read-only-error","type":"snippets","title":"Fixing Read-only File System and ADB Remount Failure","date":"2026-03-24","series":"stash","tags":["aosp"],"description":"How to resolve 'read-only file system' errors by disabling dm-verity and remounting partitions via ADB.","cover":"","review":"안드로이드 시스템 파티션 수정 시 발생하는 Read-only file system 에러를 adb disable-verity와 remount 명령어로 해결하는 방법을 단계별로 정리합니다.","key":"966d5ea419ca991f1fef34c34dc767a3"},{"file":"2026-03-24-stash-pm2-startup","type":"snippets","title":"Configure PM2 Startup for Automatic Reboot","date":"2026-03-24","series":"stash","tags":["linux"],"description":"How to use 'pm2 startup' to ensure PM2 processes start automatically after a system reboot.","cover":"","review":"리눅스 시스템 재부팅 시 PM2로 관리되는 프로세스들이 자동으로 실행되도록 설정하는 pm2 startup 명령어 사용법과 서비스 등록 과정을 정리합니다.","key":"47a2686fa95b64e1413289bcc8756bb1"},{"file":"2026-03-27-screen-tv-LadyDua2026","type":"snippets","title":"레이디 두아 (2026)","date":"2026-03-27","series":"screen","tags":["tv"],"description":"","cover":"/assets/snippets/screen/LadyDua2026.jpg","review":"레이디 두아(Lady Dua)는 가짜일지라도 완벽한 명품이 되고 싶었던 여자와 그녀가 쥔 진실을 집요하게 쫓는 형사의 쫓고 쫓기는 서스펜스를 그린 스릴러 작품이다. 현대인들의 내면에 숨겨진 허영과 욕망을 이용하여 진실에 대한 묵직한 질문을 날카롭게 파고들었다. 진실을 파헤칠수록 그녀의 정체가 서서히 드러나며, 그 과정에서 나타나는 인물들의 욕망과 심리가 흥미롭다.","key":"2857ca040fad7c9f851024087dddafb0"},{"file":"2026-03-28-screen-movie-ProjectHailMary2026","type":"snippets","title":"프로젝트 헤일메리 (2026)","date":"2026-03-28","series":"screen","tags":["movie"],"description":"","cover":"/assets/snippets/screen/ProjectHailMary2026.jpg","review":"책으로 정말 재미있게 읽었던 프로젝트 헤일메리가 영화로 개봉했다고 하여 시청했다. 결론적으로 원작을 영화로 잘 옮겨 놓은 수작이라고 생각한다. 지금껏 원작 소설을 시각화하려고 시도했던 수많은 영화를 봤지만, 그중에서
